#——物品——#
item.sfire-mod-strontium.name = 鍶
item.sfire-mod-strontium.description = 易燃金屬元素，用作反應裝甲，特殊戰鬥部以及引火組件。
item.sfire-mod-strontium.details = 化學性質過於活潑，略微受熱就會立刻劇烈氧化燃燒。在真空環境中相當穩定，但可以通過摻入其他物質來形成特殊殺傷性戰鬥部
item.sfire-mod-rubidium.name = 銣
item.sfire-mod-rubidium.description = 優質天然強電磁性能金屬，這使它能應用到一些高危的流體工業中去。用作大型磁攪拌子、阻滯鎖定器等磁性部件。
item.sfire-mod-rubidium.details = 據說這玩意的單質與某種恆星終點物質混合後會對機械體產生極大的影響\n——有待考證
item.sfire-mod-fermium.name = 鐨
item.sfire-mod-fermium.description = 用於高耐用結構與高抗熱裝甲，穿透性化學燃燒彈藥與裂變燃料。
item.sfire-mod-fermium.details = 泰伯利亞上的稀有金屬，緻密堅硬。具有放射性，這可能對周邊環境造成一定影響，但在這顆星球上已經無所謂了
item.sfire-mod-chromium.name = 鉻
item.sfire-mod-chromium.description = 質地堅硬但帶有部分脆性，常用於高等金屬加工或重型碎甲彈。
item.sfire-mod-chromium.details = 最堅硬的金屬元素，呈現出坑窪的微觀表面結構，部分設備指標只能由該元素相關製品補齊且暫無可替代物質，這通常會極大地延長設備的建造週期
item.sfire-mod-rare-earth.name = 稀土
item.sfire-mod-rare-earth.description = 用於提煉多種稀有金屬元素或多孔吸附填料。
item.sfire-mod-rare-earth.details = 曾經，這些元素相當稀有且通常混雜於矽酸鹽類雜質中難以提煉；雖然此處元素豐度相當之高，但由於其在地表總含量較低，“稀土”這一名稱依然被沿用至今
item.sfire-mod-crystal-gallium.name = 鎵晶
item.sfire-mod-crystal-gallium.description = 過冷製成固態的鎵。用於製造先進電氣元件，柔性結構，導熱器以及特殊保護塗層。
item.sfire-mod-crystal-gallium.details = 常態下呈現出液態的一種金屬物質，熔點較低但沸點極高，其以單質形式存在時的晶構十分穩定難以通過簡單的加熱而破解。高純情況下有明顯過冷趨勢，可被強制冷卻定向轉化為固態穩定結構晶體。

item.sfire-mod-silisteel.name = 磁鋼
item.sfire-mod-silisteel.description = 具有低電通率、高導磁性能和一定可塑性的廉價合金。用途廣泛。
item.sfire-mod-wavesteel.name = 波紋鋼
item.sfire-mod-wavesteel.description = 高性能輕型結構材料，在較大的溫度範圍內依然可以保持強度使用一段時間後不出現疲勞現象。用途廣泛。
item.sfire-mod-wavesteel.details = [gray]這可比萊普便宜多了[]這種溫壓擠壓工藝與流體腐蝕帶來的奇特表面紋理，得名波紋鋼
item.sfire-mod-cluster-bomb.name = 聚合炸藥
item.sfire-mod-cluster-bomb.description = 僅用作武器彈藥。可燃、易爆。
item.sfire-mod-cluster-bomb.details = 一種基於硝基化有機質的先進高性能炸藥，構造方案通用多種不同材料，但他們無一例外都由一種高燃燒性材料充當助燃劑並由其餘高爆材料組成主要戰鬥部，其爆炸速度與質能當量相較於老款爆炸混合物有顯著提升。

item.sfire-mod-discordance-fabric.name = 裂位能
item.sfire-mod-discordance-fabric.description = 高能量且不穩定的物質，用做遠距離瞬間移動或高能破甲戰鬥部。\n與泰勒載體的能量容器高度親和，可用於提升泰勒載體的能量密度。
item.sfire-mod-discordance-fabric.details = 在不封裝的情況下通過阿爾法粒子持續照射轟擊相織布來產分裂位能的第一代工藝使曾經製取過它的設備即使在停機後數月也會表現出劇烈致命的放射性會使附近的電氣設備壽命嚴重下降，以至於大規模裂位能產區附近方圓百里寸塔不生……\n好在第二代裂位能製取採用了高密度金屬進行封裝，此類問題已經得到解決\n[red]生產方無需對任何未經批准且沒有相位能量工程師等相關人員陪同的狀態下直接接觸或操作裂位能封裝外殼導致的放射殺傷、地域汙染、相位撕裂等情況負責，一經發現請立刻上報並遠離此地，等待相位應急處理組支援
item.sfire-mod-nano-core.name = 奈米核
item.sfire-mod-nano-core.description = 精細奈米材料，主要應用於各類應急修復、強化場合。
item.sfire-mod-nano-core.details = 奈米材料，伽馬！
item.sfire-mod-lens.name = 異向晶
item.sfire-mod-lens.description = 用於高等級雷射器或半導體光感元件。常見於武器級雷射偏轉器中。
item.sfire-mod-lens.details = 常態下呈現出各向異性的晶體，硬度較低且極度易碎。在特定能量引導下，其晶層結構可以受控變化。這一特性使得其光電性能無論是數值還是泛用性都遠超那些單一用處的破爛高等光學晶體，這將會開創一個光電學的新時代，一個萬能晶體的時代……\n或許我們應該考慮對這種成本高昂的晶體進行量產？
item.sfire-mod-tayrium-alloy.name = 泰勒合金
item.sfire-mod-tayrium-alloy.description = 緻密堅硬，擁有極強電磁性能的合金。用於製造超級電容器或作為其他形式能量的載體。
item.sfire-mod-leippium-alloy.name = 萊普合金
item.sfire-mod-leippium-alloy.description = 相對硬度極高的合金。用於先進裝甲，彈藥與永久性建築結構。
item.sfire-mod-leippium-alloy.details = 熱不變形，冷不變硬，抗旱防潮，結實耐糙，酸鹼不侵，絕對可靠
item.sfire-mod-memory-alloy.name = 記憶合金
item.sfire-mod-memory-alloy.description = 智能時空材料，柔韌、堅固、可控，用於先進自維持結構與柔性保護層。
item.sfire-mod-memory-alloy.details = 舊意義上的記憶金屬因其在耐溫性與抗腐蝕方面的缺陷而在泰伯利亞的戰場上的表現甚至不如簡單的塑鋼結構，以至於一度人間蒸發。裂能運用上的進步讓物質的存在第一次擁有了超越時間與空間的能力，基於相位科技的新一代記憶金屬已不再受制於僅僅記住“空間”這一個形態，更能記憶“時間”的存在

liquid.sfire-mod-nanofluid.name = 奈米流體
liquid.sfire-mod-nanofluid.description = 用作反應堆，砲台的快速散熱以及修復機構。
liquid.sfire-mod-nitrated-oil.name = 硝化重油
liquid.sfire-mod-nitrated-oil.description = 主要用於工業生產提取其中的爆炸性物質。
liquid.sfire-mod-nitrated-oil.details = 物理穩定性極差，這種流體幾乎不能承受常規衝擊，生產或者加工過程中只能採取大型緩速攪拌器來同時確保安全與效率。在作為液態炸藥時爆速極差且可能會對操作者造成傷害，通常不用於攻擊性用途，但在銷毀廢舊物品方面有相當不錯的實用性以及……觀賞性
liquid.sfire-mod-actived-nanofluid.name = 活化奈米流體
liquid.sfire-mod-actived-nanofluid.description = 武器級奈米材料，會以極快的速度中和大範圍內的奈米流體並對附近建築造成許多傷害。\n即時生效，一旦被及時抑制則無法造成足夠的傷害。
liquid.sfire-mod-nitrate.name = 硝酸
liquid.sfire-mod-nitrate.description = 強酸，用於金屬刻蝕軟化或作為武器彈藥噴向敵人。
liquid.sfire-mod-blast-reagent.name = 爆破劑
liquid.sfire-mod-blast-reagent.description = 可塑形穩定爆炸體，用作衝壓燃料或者填充爆炸性戰鬥部。
liquid.sfire-mod-mix-gas.name = 燃氣
liquid.sfire-mod-mix-gas.description = 可燃氣體，高純度存儲情況下不易爆，壓縮後用於切割焊接等高溫動火作業。
liquid.sfire-mod-mix-gas.detail = 傳熱能力差，且容易汽化。相關儲罐常因為吸收太多熱量無法及時逸散而導致氣壓型物理爆炸，而後金屬撕裂的火花又會再一次導致化學爆炸，對於此類危險化學品應當採取壓力容器存儲，並存放在遠離危險的地方。

