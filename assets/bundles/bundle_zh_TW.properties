sector.sfire-mod-frozenFront.name = 凍點前哨
sector.sfire-mod-frozenFront.description = 經過長年累月的觀測，我們終於抓到了此處軌道防禦火力維護的空檔，這裡將成為反攻泰伯利亞的第一站，務必在窗口期結束前以最快的速度清空核心區域並防止敵人呼叫增援！

sector.sfire-mod-centerCore.name = [stat]中央本部
sector.sfire-mod-centerCore.description = 在你處理軌道防禦工事之時，數支小隊在根據過去的地圖同步搜索附近區域。\n其中一支找到並發佈了集合座標，幾支小隊正在重啟以前在這座星球上建立的一座大型基地及其部分防禦設施，但徹底令其恢復運作仍有一些工作要做，尤其是啟動燈塔信標陣列，否則增援部隊只能通過先前打開的軌道防禦缺口派遣，雖然無異於杯水車薪但總比沒有好。此次行動萬分必要且直接關係到能否奪回泰伯利亞，敵人不可能注意不到如此巨大規模的要塞活動。\n儘快行動，附近的偵查隊報告有許多敵人正在靠近，組織陣地防守信標直到其他軍團落地。

sector.sfire-crackHills.name = 橫斷丘陵
sector.sfire-crackHills.description = 敵人正在源源不斷地向此處發送進攻部隊，第一軍團將戰線控制在了一處易守難攻的丘陵地區，利用地形優勢建立陣地抵擋敵人的攻擊。\n數批遠程砲火部隊正在路上，當他們抵達目標位置後便可以徹底鎖死該區域。
#解鎖方天，後續丁達爾
sector.sfire-sandValley.name = 沙暴谷
sector.sfire-sandValley.description = 這片區域因長期的風沙侵蝕而破碎不堪，飛行器較難在此處長時間行進，地面部隊推進相對來說較為穩定。一支偵查勘測小隊被派遣前出行動，但在途中因風沙所致設備故障而斷聯。\n最後一次信號定位在此處，依據行動守則車隊應該已停止前進並就近尋找安全地帶建設臨時哨位等待重連，找到他們。
#解鎖T6廠，海軍兩個
sector.sfire-craterBay.name = 彈坑海灣
sector.sfire-craterBay.description = 十分規整的圓形地坑，橫跨數百單位距離、深度未探測、成因未知、地表留有部分放射性。有說是一場未知當量的相位能武器實驗所致、也有說是曾經大規模採礦所留……但這些都已不再重要。\n海水倒灌填滿了這裡，經過實地工程勘察，地質條件及資源儲量足以建立並運營一座較大規模的海軍基地，第二軍團已在建設途中，前往協助他們。

