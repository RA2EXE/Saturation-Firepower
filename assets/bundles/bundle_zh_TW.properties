block.sfire-mod-dianguang.name = 電光箭
block.sfire-mod-dianguang.description = 聚集能量打擊並點燃目標。
block.sfire-mod-bingfengbao.name = 冰風暴
block.sfire-mod-bingfengbao.description = 延緩敵人的攻勢。與電光箭同時使用可能會降低效力。
block.sfire-mod-gaosi.name = 高斯
block.sfire-mod-gaosi.description = 發射電漿砲彈延緩目標的速度並造成傷害。
block.sfire-mod-gaosi.details = 經典款式電漿加農砲，這種原始但有效的武器在負責未知勘探的部隊中被廣泛列裝，但隨著各種新型離子武器與能量護甲的興起而逐漸沒落。
block.sfire-mod-liebao.name = 裂爆
block.sfire-mod-liebao.description = 中型震爆武器，聚集能量團投向敵人造成短暫干擾。
block.sfire-mod-cuodao.name = 銼刀
block.sfire-mod-cuodao.description = 中口徑對空霰彈砲。與差擾光束協同可有效牽制空軍部隊。
block.sfire-mod-longxi.name = 龍息
block.sfire-mod-longxi.description = 短程噴火器，焚燒一切靠近的目標。
block.sfire-mod-longxi.details = 瑞克五代電磁打火系統！
block.sfire-mod-mengma.name = 猛獁
block.sfire-mod-mengma.description = 向附近的地面目標實施快速精確的砲擊。
block.sfire-mod-zheyue.name = 折躍光束
block.sfire-mod-zheyue.description = XXX
