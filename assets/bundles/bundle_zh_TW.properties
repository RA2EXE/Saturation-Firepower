block.sfire-mod-kuodao.name = 闊刀
block.sfire-mod-kuodao.description = 短程破片砲塔，有效擊退單位，對建築效果甚微。
block.sfire-mod-mini.name = 米尼
block.sfire-mod-mini.description = 液冷式雙聯裝小口徑火砲，液冷效率相比常規砲台更高。
block.sfire-mod-mini.details = 火力持久，久到離譜
block.sfire-mod-woliu.name = 渦流
block.sfire-mod-woliu.description = 噴射大型液體球，更容易在地面形成液體區域。\n與常規液體砲台擁有相同功能。\n[red]使用[green]奈米流體[]作為彈藥時會發射具有殺傷性的[green]活化奈米流體！
block.sfire-mod-woliu.details = 一種更加武器化的液體砲台方案，但不推薦使用奈米流體作為火場管控……
block.sfire-mod-tieliu.name = 鐵流
block.sfire-mod-tieliu.description = 使用礦渣作為彈藥，噴射短程破甲金屬射流。
block.sfire-mod-tieliu.details = 盾彈對抗最新力作——當作為金屬射流載體的破甲彈因複合裝甲、力場保護、反應裝甲等因素而無法對目標造成有效傷害時——我們選擇讓敵人送上門來，而不是使用發射藥將戰鬥部送到敵人身邊。
block.sfire-mod-dianji.name = 電極
block.sfire-mod-dianji.description = 使用離子聚焦發生器對敵人持續轟擊。
block.sfire-mod-dianji.details = 先進粒子物理學武器初代研究成果
block.sfire-mod-changqiang.name = 長槍
block.sfire-mod-changqiang.description = 向目標發射大量小型飛彈或中型衝擊火箭，需要時間預熱。\n優先打擊最弱的目標以確保有效殺滅。
block.sfire-mod-changqiang.details = 一箇中程通用性火箭武器的過渡型號，裝載弱主動制導設備。\n追求多用途使其各項屬性均不足以達到某些針對性標準，有所得必有所失······
block.sfire-mod-longjuan.name = 龍捲
block.sfire-mod-longjuan.description = 發射集束螺旋彈掀翻前方區域。[yellow]對於彈藥供給速度要求較高！
block.sfire-mod-longjuan.details = [purple]龍捲風摧毀停車場！
block.sfire-mod-manyou.name = 漫遊
block.sfire-mod-manyou.description = 實驗型質子撞擊砲，發射由純能量包裹的氫離子引發粒子崩潰並熔毀敵人與裝甲。
block.sfire-mod-manyou.details = 讓 質 子 飛
block.sfire-mod-chuanyun.name = 穿雲
block.sfire-mod-chuanyun.description = 發射多種類馬赫級砲彈。
block.sfire-mod-chuanyun.details = 經典款中倍率身管式火砲，在面對不同作戰目標時可以通過臨時換裝不同彈頭以達成目的，但這需要固定種類的彈藥供給。\n若彈藥鏈混入雜物可能導致混亂而不得不暫停射擊計劃。
block.sfire-mod-cijian.name = 刺劍
block.sfire-mod-cijian.description = 掃射前方大面積區域，擊穿敵人與護盾。
block.sfire-mod-cijian.details = 劈劈啪啪，乒乒乓乓，一頓混亂，慘絕人寰
#折躍
#垂發
#4*4
block.sfire-mod-fangtian.name = 方天
block.sfire-mod-fangtian.description = 向敵方戰機發射兩枚大裝藥量飛彈或者動能殺傷彈。飛彈離開雷達範圍後可以繼續飛行一段距離。
block.sfire-mod-fangtian.details = 標準地空飛彈系統，帶有主動制導雷達使得砲體本身能夠獨立對飛彈進行目標分配和鎖定，但相應的能耗會大幅增加。
block.sfire-mod-leizhenyu.name = 雷陣雨
block.sfire-mod-leizhenyu.description = 向地面目標發射遠程高爆火箭，擁有末端制導系統。
block.sfire-mod-leizhenyu.details = 標準遠程地地火箭系統，儘管已經擴建了一次砲體與彈藥口徑來提升彈藥的基礎攜帶力，但仍因需要維持在遠程拋物彈道情況下的有效殺傷力而去除了末端制導以外的設備。
block.sfire-mod-qingning.name = 清寧
block.sfire-mod-qingning.description = 拋射一對過載能量彈，對機械、電氣裝置造成嚴重損害，同時干擾敵人的武器系統。
block.sfire-mod-chongchao.name = 蟲潮
block.sfire-mod-chongchao.description = 發射一對威力巨大的奈米子母彈，對沿途敵人造成殺傷並修復己方建築，可提供一定量的超速。\n[stat]彈藥會穿過力牆。
block.sfire-mod-chongchao.details = watch out the [green]flash!
#5*5
block.sfire-mod-relang.name = 熱浪
block.sfire-mod-relang.description = 鎖定充能後發射一道純熱能波束對直接命中的目標造成雙倍傷害。\n對固定的目標殺傷效果優秀，並不擅長處理快速移動的目標。
block.sfire-mod-relang.details = 隨著戰事的進行，雙方軍工廠幾近超負荷運作，防線壓力大幅增加，我們正需要這樣一款維護簡單、威力強大的防禦性砲台……\n第二代熱能離子軌道砲，代號“熱浪”，能量武器化最原始最粗暴最有效的利用方式——通過強加熱使空氣電離而做到無需通過砲體本身附加介質情況下對目標輸送殺傷能力。\n有箇壞消息，[brick]敵人的研究似乎比我們的更先進。
block.sfire-mod-sizhao.name = 死詔
block.sfire-mod-sizhao.description = 打擊低速重型目標或者遠距目標。
block.sfire-mod-sizhao.details = 基於厄兆理論基礎的二代工質軌道砲，泰勒載體的裂能容器使得更大規模的瞬發能量輸出成為可能，但一味的增加口徑與功率並非可取之道，這會導致更嚴重能量逸散與更低的能量利用率。即使裂能軌道在一定程度上可以降低因射程導致的殺傷性能損耗，過度依賴一種固定的砲火支援也難以在日後的戰鬥中發揮作用。
block.sfire-mod-sizhao.sfire-mod-discordance-fabric.info = 能量波束穿透敵人時會提升傷害
block.sfire-mod-liemei.name = 裂梅
block.sfire-mod-liemei.description = 向遠程地面目標拋射數枚重型集束砲彈，精度不佳，常用於一定範圍內的覆蓋性打擊。\n[stat]彈藥會穿過力牆。
block.sfire-mod-liemei.details = 地面重火力投送的最優選擇，少量集中部署的裂梅便能壓制一定規模的地面戰場或將其用於關鍵隘口的砲火壓制，但在同一運輸鏈上部署過多會導致供應壓力的嚴重增加\n謹慎選擇其部署量和位置
block.sfire-mod-cuowei.name = 錯位
block.sfire-mod-cuowei.description = 發射相位震盪彈或者裂能震盪彈，對護盾有極強破損效率。
block.sfire-mod-cuowei.details = 先進膜理論的相關研究表明：相似相溶原理並非只適用於宏觀物理學，其是世間萬物的共有屬性。這意味著一切基於相位理論的防禦體系皆可以被同波段武器共振失效，通過控制相織布的震盪屬性並以質子包裹發射與護盾共振可以快速令護盾引擎過載，而能量密度更高的裂能彈頭會直接破除護盾並造成額外傷害。
block.sfire-mod-cuowei.phase-fabric.info = 衰減目標剩餘護盾的[stat]10%，分裂彈[stat]5%
block.sfire-mod-cuowei.sfire-mod-discordance-fabric.info = [stat]反轉護盾[]並造成[stat]25%護盾值[]的額外傷害
#6*6
block.sfire-mod-dingdaer.name = 丁達爾
block.sfire-mod-dingdaer.description = 向敵方空中單位發射密集的穿透光束。持續開火時射速逐漸提高。
block.sfire-mod-dingdaer.details = 新材料的加入帶來光學晶體突破，依賴工質的光熱離子砲正在逐漸被這一類先進的猝發雷射器所取代。有了老式能量武器的開發與應用經驗，第三代光熱學武器隨之誕生，代號“丁達爾”的大口徑雷射防空設施便是其中的一員。它能精準有效地把敵機打成篩子，同時能對同屬相位波段的力量護盾造成毀滅性打擊。
block.sfire-mod-guangyin.name = 光陰
block.sfire-mod-guangyin.description = 發射由純能量包裹的重氫彈，造成小型聚變爆炸。\n可以使用巨浪合金來更改彈頭屬性。
block.sfire-mod-guangyin.details = 即使無需工質的能量武器開發應用能為戰局帶來更多優勢，這類大型化的質子撞擊砲在戰場上依然不可或缺，它們不同於“丁達爾”那類純粹而精密甚至稱得上“嬌貴”的光學武器無法承受複雜的地面作戰環境而只能抬高俯仰角專注於空中，皮實有效小型化的重氫聚變彈對環境的適應性更強，在兼顧地面與空中目標的同時能保證足量的殺傷效益。\n讓氚核飛~
block.sfire-mod-cimai.name = 刺霾
block.sfire-mod-cimai.description = 發射相位波段級穿甲彈，需要固定種類的彈藥供給。\n[stat]對任何可以被直接攻擊的大型目標有相當高的毀滅效率。
block.sfire-mod-cimai.details = 相位能包裹的重型彈頭在撞擊目標時能暫時保持彈頭不發生形變，並在撞擊結束後的破甲毀傷階段快速釋放形變，這使得刺霾對越大體積的目標擁有越強大的毀傷性能，但這層能量膜也會使彈體受到極大的空間位移阻力。
block.sfire-mod-cimai.sfire-mod-chromium.info = 削弱目標並對大體型目標造成一定比例的額外傷害
block.sfire-mod-cimai.sfire-mod-leippium-alloy.info = 對大體型目標造成更高比例的額外傷害
block.sfire-mod-fengmang.name = 鋒芒
block.sfire-mod-fengmang.description = 將液體轉變為流離子態隨光壓噴向目標。\n傷害隨光束照射時間逐漸提升。
block.sfire-mod-fengmang.details = 光推進動力學頂尖之作，基於裂能載體的物質傳輸技術，在保持物質的分子構造與物理性質的情況下與光子流束重整並通過光壓推進，在有效射程內等價於開火即命中的無延遲高效殺傷方案。
#8*8
block.sfire-mod-yuanling.name = 怨靈
block.sfire-mod-yuanling.description = 向目標發射巨型被帽鈍頭彈，造成嚴重殺傷並擊退敵人。
block.sfire-mod-yuanling.details = 標準化第五代大口徑重型動能彈頭防禦武器，厚重的裝甲與高裝藥量過威力彈使其擁有強悍的正面受敵與輸出性能。\n維護簡單的武器是複雜戰場狀況下的最優選擇。怨靈雖建造消耗較高，但事實證明這種堅實的過冗餘結構底座是一個正確的選擇，它正在逐漸取代大部分武器成為當前也可能是以後大部分戰場的中流砥柱。
block.sfire-mod-kuosan.name = 擴散軌道砲
block.sfire-mod-kuosan.description = 發射極具毀滅性的大範圍集束砲彈或者重型護盾破除彈。
block.sfire-mod-kuosan.details = 一種實驗性的新型裝藥方案：裂能引信戰鬥部能均勻的將爆炸能量散佈到爆炸範圍內，從而保護彈藥的全向殺傷性避免因距離和阻擋導致的嚴重能量衰減。\n這也是一種極度危險的彈藥方案，意味著能量將不再能精準聚集而是均勻分佈，這可能對某些重型裝甲目標失去有效殺傷性，但巨大的殺傷半徑仍然使其值得一試。\n為什麼不試試EU的連續軌道砲呢？
block.sfire-mod-kuosan.sfire-mod-discordance-fabric.info = 每次穿透提升[stat]50%[]傷害，沒有上限
block.sfire-mod-poxiao.name = 破曉
block.sfire-mod-poxiao.description = 脆弱的雷射發生器，短暫充能後發射一對強大的能量束。\n使用可替換一次性大型武器級光學稜鏡來提升單發功率。
block.sfire-mod-poxiao.details = 一道光，劃破夜空。多門破曉射擊時的光芒足以照亮一片戰區，同時會給電力系統帶來極大負擔，確保你的電網實時供應充足或提前建造更多的蓄電池。\n由於雷射發生器所用稜鏡需要循環使用以確保火力連續性，常態功率必定有所限制，但天才們想出了一種十分危險但有效的功率突破方案……類似於實彈武器的切換彈匣，他們選擇切換破曉的雷射稜鏡，將功率提升到可怕的高度，但無法有效抑制能量逸散。但這意味著需要消耗額外的資源去維護並替換因滿載而壽命只有一次使用機會的雷射發生器。
block.sfire-mod-kuosan.sfire-mod-lens.info = 將開火模式切換為需要蓄力的強力單發射擊
block.sfire-mod-fenqing.name = 憤傾
block.sfire-mod-fenqing.description = 向敵人傾瀉密集的電磁脈衝彈，癱瘓其系統功能並造成嚴重損毀。
block.sfire-mod-fenqing.details = 電磁學最新力作，孱弱無力的傳統電能釋放儲存轉化已成為過去式，在泰勒-相位能複合能量載體的幫助下能量的收放以及轉化效率可以達到驚人的九成以上。但直接聚集純粹的能量作為打擊手段依然不是一個好主意，在彈藥飛行途中維持其物理狀態所消耗的能量實際上遠大於釋放在目標身上的能量，若要造成可觀物理損壞還需經過一次電熱轉化實在是得不償失，但我們依然可以通過提高能量輸出功率將有效損傷全部用於破壞其內部系統來達成作戰目的。
block.sfire-mod-zhulin.name = 竹林
block.sfire-mod-zhulin.description = 利用裂位能預設軌道後釋放近炸遊弋彈群進行轟炸。[red]需要大量電力與冷凍液支持運行！
block.sfire-mod-zhulin.details = [yellow]王 的 問 候 ！\n武器化並不是物流系裂能引擎該做的事，尤其是在較小範圍內並行創建數百條無目標的軌道會消耗太多能量並逸散巨量熱能，這些逸散的能量不僅無法回收利用甚至會對砲體結構產生不可預見的風險。\n但在見識過其殺傷投送性能之後，這些巨大的消耗是值得的……或許？
block.sfire-mod-luolong.name = 絡龍
block.sfire-mod-luolong.description = 重型動能打擊複合動力砲，十分擅長處理大型打擊任務，對非第一個命中的目標造成雙倍傷害。
block.sfire-mod-luolong.details = 驅動大型物體長程高速運動所需的動力是非比尋常的，但有了竹林的先例，針對裂能引擎的後續改進十分容易。基於能量覆層的空阻降低與途中加包技術已經十分成熟，即使是如此大的彈體也能被加速到高超聲速並在撞擊過程中撕裂一塊碎片帶著它繼續撞向下一個目標，同時這種大型化的引擎所具備的超高輸出功率會使得砲彈出膛時產生一道激波，這片激波甚至能對附近的目標造成傷害




block.sfire-mod-defense-platform-cannon.name = 爆能彈防禦平台
block.sfire-mod-defense-platform-torpedo.name = 魚雷防禦平台
block.sfire-mod-defense-platform-nuke.name = 裂變飛彈防禦平台
unit.sfire-mod-defense-platform-nuke-missile.name = 核飛彈
block.sfire-mod-defense-platform-laser.name = 雷射防禦平台
block.sfire-mod-defense-platform-missile.name = 防空飛彈防禦平台
block.sfire-mod-defense-platform-plasma.name = 熱能軌道砲防禦平台
#Experimental Thermal Railgun
#Vertical Launching System
block.lancer.details = 優化能量閥，升級雷射發生器，增設電弧引信
block.swarmer.details = 適配更多彈藥，優化結構以提升火力密度
block.fuse.details = 更強的透射聚焦稜鏡與先進火控系統是個不錯的選擇，事實也證明確實如此。\n任何向小型化砲台上安裝不穩定且具有安全隱患的裂能者應當被立即丟入相位空間中！\n[darkgray]下不為例
block.spectre.details = 第三代大口徑物理實彈防禦武器，先進水冷系統，適配不同口徑砲管並使用全威力彈。\n“幽靈是個老伙計了”


#——鑽頭——#
block.sfire-mod-energe-drill.name = 壓力電動鑽頭
block.sfire-mod-energe-drill.description = 基礎電動鑽頭，體積較大。\n電網中可支配的富餘電能愈多，其鑽探速度愈快。\n當電網中的富餘電力大於正常運行所需時鑽頭效率會逐漸提高。
block.sfire-mod-energe-drill.details = 顯然碳素鑽頭的強度並不足以與放射性金屬元素硬碰硬，但這將是電力應用探索之路上的重要一步。
block.sfire-mod-heavy-drill.name = 重型切削鑽頭
block.sfire-mod-heavy-drill.description = 使用速率較低但扭矩輸出極大的電動引擎，搭配變速箱組將扭矩升到足夠高以在堅硬的地層中快速開採更硬的礦石。\n需要更多時間啟動鑽頭。\n當電網中的富餘電力大於正常運行所需時鑽頭效率會逐漸提高。
block.sfire-mod-heavy-drill.details = 注意！使用高扭矩鑽頭進行低硬度開採是一種極為不明智的方法！\n請分辨並選擇正確的鑽頭種類來開採資源！
block.sfire-mod-blast-ore-well.name = 爆破鑽井
block.sfire-mod-blast-ore-well.description = 向地層中注入液態炸藥爆破採礦並以中等速度分批輸出。\n[red]警告：嚴禁用於開採處於臨界狀態的放射性礦石！
block.sfire-mod-blast-ore-well.details = “高豐度鐨礦脈進行向心爆破採礦測試，第三次，20%爆破劑接觸，起爆！”\n“有效開採量低於預期，提高爆破劑接觸率”\n“收到，高豐度鐨礦脈進行向心爆破採礦測試，第四次，30%爆破劑接觸，起爆！”\n......\n“開採量依然很低，真的還要再加嗎？當前接觸率下的風險係數已經很高了”\n“繼續加吧...至少找到起爆臨界值”\n“高豐度鐨礦脈進行向心爆破採礦測試，第十三次，80%爆破劑接觸，起爆！”\n*巨響\n錄音結束\n那次爆破測試直接令直徑120單位距離內一切物體[lightgray]灰飛煙滅[]。自此，高能放射性礦石被嚴禁使用任何強度的液態爆破採礦
block.sfire-mod-quantum-extractor.name = 量子提取機
block.sfire-mod-quantum-extractor.description = 直接從地下轉移礦物。需要持續的冷卻液供給，可以安置在水上。

block.sfire-mod-water-extractor.name = 重型抽水機
block.sfire-mod-water-extractor.description = 需要更多能源與時間來啟動。
#block.sfire-mod-軟流掘進機.name = 軟流掘進機
#block.sfire-mod-軟流掘進機.description = 耐高溫處理強化鑽頭，放在高熱的地形上可以鑽探礦渣，需要一定時間啟動。
#block.sfire-mod-軟流掘進機.details = 請不要當絕地小子
block.sfire-mod-oil-pressure-pump.name = 岩隙壓油塔
block.sfire-mod-oil-pressure-pump.description = 向含油地層中注入高壓氮氣來快速大量的提取石油。\n設計操作彈性極大，為避免不必要的浪費，請自行計算所需產能比例。
block.sfire-mod-oil-pressure-pump.details = 向岩層下方打入一條管道的過程中通過更高的流體壓力反向頂回油壓防止反沖的勘探式開採方案直到如今依然是一種有效且穩定的採油方案，即使這會導致更高的能耗與機械損耗，但比起這被機器源源不斷帶出地表的原油，那些微不足道的損耗完全可以忽略不計了
block.sfire-mod-gas-extractor.name = 岩隙提氣機
block.sfire-mod-gas-extractor.description = 在含油裂隙上提取燃氣，需要消耗電力。
block.sfire-mod-spore-cultivator.name = 溫室培養皿
block.sfire-mod-spore-cultivator.description = 燃燒產生的氣體成分似乎有利於孢子的生命活動，密閉的溫室環境可以對其進行大批量的快速繁殖。
#——物流——#
block.armored-conveyor.details = 可以安置在水上
block.sfire-mod-wavesteel-conveyor.name = 波動傳送帶
block.sfire-mod-wavesteel-conveyor.description = 向前方運輸物品，比鈦傳輸帶快一倍。\n可以安置在水上。
block.sfire-mod-wavesteel-junction.name = 波動交叉器
block.sfire-mod-wavesteel-junction.description = 向前方運輸物品，允許傳送帶穿過它交叉運輸，比交叉器快一倍。\n可以安置在水上。
block.sfire-mod-wavesteel-bridge.name = 波動傳送帶橋
block.sfire-mod-wavesteel-bridge.description = 跨越任何地形向前方運輸物品，比鈦傳輸帶快一倍。\n可以儲存少量物品\n可以安置在水上。
block.sfire-mod-complex-armored-conveyor.name = 複合裝甲傳送帶
block.sfire-mod-complex-armored-conveyor.description = 快速地在戰場運輸物品，不接受邊上的輸入，已做水密封處理，耐高溫且絕緣。
block.sfire-mod-silisteel-conveyor.name = 磁鋼傳送帶
block.sfire-mod-silisteel-conveyor.description = 提供較大批量打包物品進行運輸，通電加速運行。\n可以安置在水上。
block.sfire-mod-discfabric-bridge.name = 裂位物品傳送塔
block.sfire-mod-discfabric-bridge.description = 跨越任何地形傳送物品，比布橋更快，更遠。
block.sfire-mod-discfabric-massdriver.name = 裂位驅動器
block.sfire-mod-discfabric-massdriver.description = 超遠距離發送物品包，收集一定物品後將其發射到另一個裂位驅動器中。\n最低發射容量：60

block.sfire-mod-molecular-database.name = 分子數據庫
block.sfire-mod-molecular-database.description = 掌握分子碎裂重組技術，有效填充倉庫空間。
block.sfire-mod-hyper-unloader.name = 高速卸載器
block.sfire-mod-hyper-unloader.description = 從附近的容器中卸載物品，比普通卸載器更快。

#——液流——#
block.impulse-pump.details = 加量不加價，效率更高60%！
block.plated-conduit.details = 可以安置在水上
block.sfire-mod-silisteel-conduit.name = 磁鋼導管
block.sfire-mod-silisteel-conduit.description = 真空雙層加固內膽，以高壓傳輸液體。\n[red]易碎，不要磕碰。
block.sfire-mod-complex-armored-conduit.name = 複合裝甲導管
block.sfire-mod-complex-armored-conduit.description = 快速地在戰場輸送液體，不接受邊上的輸入，已做水密封處理，耐高溫且絕緣。
block.sfire-mod-silisteel-bridge-conduit.name = 磁鋼導管橋
block.sfire-mod-silisteel-bridge-conduit.description = 真空雙層加固內膽，以高壓傳輸液體。\n跨越任意地形傳輸液體。
block.sfire-mod-silisteel-tank.name = 磁鋼儲液罐
block.sfire-mod-silisteel-tank.description = 雙層中空絕緣外殼，可以更安全地儲存大量危險液體。
block.sfire-mod-discfabric-liquid-bridge.name = 裂位導管塔
block.sfire-mod-discfabric-liquid-bridge.description = 跨越任何地形傳輸流體，比布橋更快，更遠。
block.sfire-mod-tidal-pump.name = 潮汐泵
block.sfire-mod-tidal-pump.description = 究級液泵，引力工程學的奇蹟。

#——生產——#
block.silicon-crucible.details = 升級高耐熱外殼，優良熱傳導底座。得以更高的熱轉化效率。\n可以安置在液體上。
block.sfire-mod-crusher.name = 水壓破碎機
block.sfire-mod-crusher.description = 大規模破碎廢料為沙子，需要輸入水和電力，
block.sfire-mod-crusher.details = ——電動機扭矩都不夠用怎麼辦？\n——上液壓機！
block.sfire-mod-large-melter.name = 大熔爐
block.sfire-mod-large-melter.description = 用於更大批量的熔化礦渣。當基礎熔爐效率不再足夠工業消耗之時，或許我們應該開發新機器？
block.sfire-mod-spore-compressor.name = 孢子沖壓機
block.sfire-mod-spore-compressor.description = 雙倍沖程，更高產能。
block.sfire-mod-flywheel-centrifuge.name = 飛輪離心機
block.sfire-mod-flywheel-centrifuge.description = 提取石油中的煤炭。
block.sfire-mod-flywheel-centrifuge.details = 開碳不規範，大哥低頭轉
block.sfire-mod-pyratite-blender.name = 硫捆合器
block.sfire-mod-pyratite-blender.description = 批量合成硫。
block.sfire-mod-blast-blender.name = 爆炸混合物捆合器
block.sfire-mod-blast-blender.description = 批量合成爆炸混合物。
block.sfire-mod-clus-blender.name = 炸藥聚合器
block.sfire-mod-clus-blender.description = 將硫和爆炸混合物捆綁為聚合炸藥。
block.sfire-mod-cryofluid-centrifuge.name = 冷凍液離心機
block.sfire-mod-cryofluid-centrifuge.description = 打碎鈦粉分散入液相中製取冷凍液。
block.sfire-mod-plastanium-mutilcompresser.name = 複合塑鋼壓縮機
block.sfire-mod-plastanium-mutilcompresser.description = 擴大壓縮主機規模，更加高效生產塑鋼。
block.sfire-mod-surge-thermal-smelter.name = 溫壓合金冶煉爐
block.sfire-mod-surge-thermal-smelter.description = 使用廢料和矽在高溫高壓爐內低效率地冶煉合金
block.sfire-mod-surge-electric-smelter.name = 電磁合金冶煉爐
block.sfire-mod-surge-electric-smelter.description = 磁鋼的優秀磁電性能為高級磁熱冶煉提供了硬體基礎，這能更高效率並更多地冶煉合金。
block.sfire-mod-phase-activer.name = 歸中激發器
block.sfire-mod-phase-activer.description = 以輻射賦予物質上形成相織布。
block.sfire-mod-phase-activer.details =

block.sfire-mod-silistell-smelter.name = 磁鋼冶煉爐
block.sfire-mod-silistell-smelter.description = 將鈦和矽冶煉為磁鋼。
block.sfire-mod-silistell-smelter.details = 作為一種被大批量廣範圍應用的基礎電氣合金，由於初期研發工作的缺席使得大型冶煉器械被開發出來之前一直處於供不應求的狀態，相較於獨立設置工業區用於冶煉該金屬後再經由物流系統分發至各處，更多情況下是由原料供應鏈或物資集散區旁使用這種小型冶煉器械就地生產以滿足廣域需求
block.sfire-mod-silistell-smelter-large.name = 磁鋼冶煉廠
block.sfire-mod-silistell-smelter-large.description = 使用磁電科技改良冶煉工藝從而快速冶煉磁鋼。
block.sfire-mod-silistell-smelter-heater.name = 磁鋼熱能高爐
block.sfire-mod-silistell-smelter-heater.description = 將鈦和矽批量冶煉為磁鋼。\n比磁鋼冶煉爐更高效，需要大量熱能供給。
block.sfire-mod-silistell-smelter-heater.details = 隨著戰線的深入，越來越多的鈦礦與矽產能被劃入磁鋼的生產計劃內，但磁鋼的供給仍然極不穩定。無論是在後方或是前線，這種優良的電磁性能以及低廉的造價使得它被應用在幾乎所有的地方。好在這種臨時暴力搭建的冶煉高爐效率相當不錯，這能一定程度上的降低後方磁鋼產線的壓力
block.sfire-mod-silistell-crucible.name = 磁鋼再構爐
block.sfire-mod-silistell-crucible.description = 將銣和鉻冶煉為磁鋼。
block.sfire-mod-wavesteel-compresser.name = 波紋鋼鍛造機
block.sfire-mod-wavesteel-compresser.description = 將鉻與鉛鍛造為波紋鋼。
block.sfire-mod-wavesteel-forger.name = 軟化鍛鋼機
block.sfire-mod-wavesteel-forger.description = 在硝酸的輔助下，將鉻與鉛鍛造為波紋鋼。
block.sfire-mod-wavesteel-forger.details = 比起“軟化”更確切的來說是“溶解”，鉻硬度過高，在能量供應不足的地區，除非採用幾乎絕熱封閉高爐，否則熔融鍛造合金永遠不是一個節能之跡
block.sfire-mod-metal-analyzer.name = 金屬分析儀
block.sfire-mod-metal-analyzer.description = 經典重結晶，這種簡單的方法能直接分離稀土中的簡易材料。
block.sfire-mod-metal-precipitater.name = 稀土分析所
block.sfire-mod-metal-precipitater.description = 利用硝酸施加電場大批量地崩解稀土以快速分離其中的有效材料。
block.sfire-mod-gallium-supercooler.name = 鎵晶過冷器
block.sfire-mod-gallium-supercooler.description = 自礦渣中提純製造鎵晶。
block.sfire-mod-gallium-supercooler.details = 熔融態金屬雜質中鎵含量雖然較低，但利用其獨特的物理屬性反覆過冷熔化可令鎵液析出而留下其他雜質，分離蒸汽並吸收後過冷製成晶體態單質鎵
block.sfire-mod-nano-constructor.name = 奈米組裝機
block.sfire-mod-nano-constructor.description = 機械組裝構建可編程的用於各種方面的智械材料。
block.sfire-mod-nano-printer.name = 奈米打印機
block.sfire-mod-nano-printer.description = 奈米級3D打印可編程的用於各種方面的智械材料。
block.sfire-mod-lens-atomizer.name = 沉降造晶器
block.sfire-mod-lens-atomizer.description = 在負壓惰性氣體保護下對矽晶底片進行長時間的金屬粒子摻雜沉降以製造純淨晶體。
block.sfire-mod-discfabric-phase-waver.name = 激發裂位放射塔
block.sfire-mod-discfabric-phase-waver.description = 使用裂能框架鐨核載體的的定向粒子流束代替α粒子流。\n這會導致鐨的強烈衰變放出大量射線，務必做好冷卻防護措施。
block.sfire-mod-discfabric-phase-knitter.name = 反射裂位聚合器
block.sfire-mod-discfabric-phase-knitter.description = 使用鐨與稀土直接聚合裂位能。
block.sfire-mod-air-collector.name = 大氣壓縮機
block.sfire-mod-air-collector.description = 緩慢收集大氣並壓縮提取其中的氮氣為可工業使用的規模。
block.sfire-mod-air-collector.details = 大氣中的微量孢子也會隨空氣混入壓縮機並成為產出之一，為保證空氣壓縮機的正常運行，請及時處理堆積的孢子
block.sfire-mod-air-cooler.name = 冷凍壓縮機
block.sfire-mod-air-cooler.description = 使用冷凍液迅速降溫並分離出氮氣而不產生其他雜質。
block.sfire-mod-air-cooler.details = 基於熱力卡諾循環熱泵技術——以較低的能耗轉移更多的熱量——當然這是對於能量品級而言，使用冷凍液這種高品質冷源對換低熱能產生氮氣雖能大幅節省能量，但等價位的電壓縮機冷卻性價比顯然更高……
block.sfire-mod-nitrate-mixer.name = 電弧硝化室
block.sfire-mod-nitrate-mixer.description = 電解水得到氧氣並與氮氣在電弧室內合成硝酸。\n設計操作彈性極大，為避免不必要的浪費，請自行計算所需產能比例。
block.sfire-mod-nitrate-mixer.details = 氮氧電解化合，這一反應在過去曾被用於製造有機質助長劑，但由於其能耗過高，副反應難以控制被逐漸棄用。\n如今其中一種副反應被重新啟用以製造這種強酸
block.sfire-mod-fractionator.name = 石油分餾塔
block.sfire-mod-fractionator.description = 分餾石油，產出燃氣和少量煤炭。\n設計操作彈性極大，為避免不必要的浪費，請自行計算所需產能比例。
block.sfire-mod-fractionator.details = 隨著先進化工學進步，石油產業的相關製程已不再需要強制部署全套處理設備，精準裂解-分餾工藝能直接將原油處理為目標產品。但部分難以裂解而無法利用的高碳組分依然會成為沉澱物輸出，這是先進化工學的恥辱，終有一天會尋找到解決它的辦法……
block.sfire-mod-chemical-silicon-smelter.name = 化學矽冶煉爐
block.sfire-mod-chemical-silicon-smelter.description = 使用燃氣在高溫條件下還原矽。
block.sfire-mod-blast-silicon-smelter.name = 爆破沖壓爐
block.sfire-mod-blast-silicon-smelter.description = 利用爆炸沖壓沙子冶煉矽。
block.sfire-mod-blast-silicon-smelter.details = 什麼都爆破只會害了你……
block.sfire-mod-nitrification-reactor.name = 硝化反應器
block.sfire-mod-nitrification-reactor.description = 利用生化反應生產硝化重油。[red]當心爆炸！
block.sfire-mod-nitrification-reactor.details = [red]安全事故是個寶  你孬我孬大家孬
block.sfire-mod-nitrification-centrifuge.name = 硝化反應釜
block.sfire-mod-nitrification-centrifuge.description = 利用化學反應生產硝化重油。[red]當心爆炸！
block.sfire-mod-nitrification-centrifuge.details = [red]安全事故是個寶  你孬我孬大家孬
block.sfire-mod-nitratedoil-precipitator.name = 重油沉澱池
block.sfire-mod-nitratedoil-precipitator.description = 持續攪動緩慢沉澱分離硝化重油中的固體物質。[red]當心爆炸！
block.sfire-mod-nitratedoil-precipitator.details = [red]安全事故是個寶  你孬我孬大家孬
block.sfire-mod-nanofluid-activator.name = 奈米流化器
block.sfire-mod-nanofluid-activator.description = 激活奈米核分散微觀結構為固流體。
block.sfire-mod-nanofluid-activator.details = 取決於奈米核的製程和良品率，這可能會有所損耗
block.sfire-mod-nanofluid-mixer.name = 奈米轉化廠
block.sfire-mod-nanofluid-mixer.description = 當冷凍液產能過剩時，將足量的冷凍液迅速轉化為一定數量的奈米流體。\n設計操作彈性極大，為避免不必要的浪費，請自行計算所需產能比例。
block.sfire-mod-blastreagent-mixer.name = 爆破劑配置器
block.sfire-mod-blastreagent-mixer.description = 去除硝化重油中的無關雜質並使用碎稀土吸附固定增加粘性，同時保留部分流動能力。
block.sfire-mod-blastreagent-mixer.details = [red]安全事故是個寶  你孬我孬大家孬
block.sfire-mod-clus-maker.name = 炸藥固化機
block.sfire-mod-clus-maker.description = 將爆破劑固化為聚合炸藥。
block.sfire-mod-clus-maker.details = [red]安全事故是個寶  你孬我孬大家孬
block.sfire-mod-tayrium-smelter.name = 泰勒合金冶煉廠
block.sfire-mod-tayrium-smelter.description = 使用巨浪合金，磁鋼冶煉泰勒合金。
block.sfire-mod-tayrium-crucible.name = 泰勒合金高爐
block.sfire-mod-tayrium-crucible.description = 使用鍶，磁鋼，矽冶煉泰勒合金。
block.sfire-mod-tayrium-crucible.details = 直至此刻，你或許應該明白：泰勒合金不過是一個統稱，一個“具有優良電磁性能”的合金方案的統稱，也許物理應力性能不如老式配方，但這些合金最終追求的極致電磁性能已然達到預期，將其統一管理是降低勤務處壓力的正確方案
block.sfire-mod-leippium-smelter.name = 萊普合金冶煉廠
block.sfire-mod-leippium-smelter.description = 使用鐨，鉻冶煉萊普合金。\n[darkgray]If u want it
block.sfire-mod-leippium-smelter.details = [darkgray]then u'll have to take it
block.sfire-mod-leippium-crucible.name = 萊普合金沖壓爐
block.sfire-mod-leippium-crucible.description = 爆炸沖壓成型萊普合金。
block.sfire-mod-leippium-crucible.details = 若當地能源已經不足以分配足夠多的能源以支撐高能耗的熱能冶煉爐的時候，或許爆炸沖壓能夠更加節省能量\n什麼都爆破只會害了你……等下，[#d97c7c]這是什麼\n[darkgray]but u already knew that
block.sfire-mod-memory-locator.name = 記憶合金定位儀
block.sfire-mod-memory-locator.description = 生產記憶金屬，一種先進智能材料。
block.sfire-mod-memory-locator.details = 基於奈米技術與裂能材料為金屬打入“時空鉚釘”，將材料的“初始形態”定義在此，隨後可應用於各領域之中

block.sfire-mod-rare-craft.name = 不嘻嘻稀土合成器
block.sfire-mod-rare-craft.description = [red]測試方塊[]\n用於泰伯利亞戰役做完之前在自定義、伺服器中合成稀土，或者作圖時使用數據包修改以讓它用於其他功能
block.sfire-mod-ferm-craft.name = 煤用的鐨鎢合成器
block.sfire-mod-ferm-craft.description = [red]測試方塊[]\n用於泰伯利亞戰役做完之前在自定義、伺服器中合成鐨，或者作圖時使用數據包修改以讓它用於其他功能
#——電力——#
block.differential-generator.details = 得益於材料進步，我們能夠用更少的材料控制更強大的燃燒、進行更大面積的換熱、產出更多的電力……以及發生更危險的生產安全事故！
block.sfire-mod-armor-battery.name = 強化鍍層電池
block.sfire-mod-armor-battery.description = 更安全的存儲大量能量。
block.sfire-mod-armor-battery.details = 能量載體的不穩定缺點已被新進的結構設計所克服，通過安裝更厚實的外部主裝甲結構和優化電池內部的儲能池結構設計在一定程度上抑制了裂位能洩漏的強度。
block.sfire-mod-armor-node.name = 鍍層裝甲節點
block.sfire-mod-armor-node.description = 覆蓋鍍鉻裝甲的大型能量節點，提供更多的鏈接目標與略高的鏈接範圍。\n可以放置在水上。
block.sfire-mod-discfabric-node-tower.name = 裂位能源塔
block.sfire-mod-discfabric-node-tower.description = 超遠距離傳輸能量，提供3個鏈接。
block.sfire-mod-coal-pyrolyzer.name = 煤炭熱解器
block.sfire-mod-coal-pyrolyzer.description = 使用水和高温熱解氣化煤炭，輸出少量燃氣。\n多餘的氣體將直接拋棄而不會造成堆積。
block.sfire-mod-coal-pyrolyzer.details = 由閃蒸技術發展而來的閃爆技術對於大塊燃料來說並不能使其充分燃燒，但是在釋壓過程中噴灑水霧能讓燃料塊因熱脹冷縮迅速崩解，立刻絕熱加壓可分解水與碳灰。該過程中釋放的大量熱量被用於渦輪機發電，其副產物燃氣可用於多種工業場合
block.sfire-mod-gas-generator.name = 燃氣發電機
block.sfire-mod-gas-generator.description = 回收多餘燃氣產生少量電能。
block.sfire-mod-gas-generator.details = 警告：使用煤炭熱解並使用此機器回收燃氣發電並不是一個明智的選擇，儘管其能量密度略高於火力發電機，但該過程導致的能量損失是無法憑空產生的！\n“我現在十分懷疑你拿到這份工作所用工程學證書的種類以及學位證書的真實性”
block.sfire-mod-gas-turbine.name = 燃氣輪機
block.sfire-mod-gas-turbine.description = 燃燒液體推動渦輪發電，需要時間預熱，在全速運行時提供更多能量。
block.sfire-mod-gas-turbine.details = 純物理性質的飛輪儲能重型渦輪引擎發電機，單論發電效率及供電速度可能不如輕型的老一代渦輪發電機，但新型的液態可控飛輪引擎使發電機運行過程中產生的能量會被儘可能多的轉化為動能並產生更高能量，即使在燃料供應不足的情況下依然能持續運轉一定時間
block.sfire-mod-heat-generator.name = 地熱發電機二型
block.sfire-mod-heat-generator.description = 放在熾熱的地形上可以發電，能量產生比例更高。
block.sfire-mod-heat-generator.details = 發電的盡頭是燒開水！
block.sfire-mod-radiation-generator.name = 環境輻射發電機
block.sfire-mod-radiation-generator.description = 與地熱發電機類似，但其利用輻射環境發電。
block.sfire-mod-radiation-generator.details = 基於壓電晶體與波紋鋼極致的緻密性使得收集環境輻射流打擊巨浪合金發電成為可能，在地熱發電機的基礎上，能源部門針對其外源能量收集進行了改進包括但不限於：輻射流收集，輻熱轉化，逸散抑制……於是一款在泰伯利亞上十分方便的環境能發電機誕生了\n“我不知道該誇能源部門靈活變通地使用一切可用資源還是該罵戰爭把泰伯利亞汙染成這樣而它們竟還有心思利用這份該死的汙染”
block.sfire-mod-fermium-reactor.name = 鐨反應堆
block.sfire-mod-fermium-reactor.description = 利用鐨的強烈放射性產生能量，需要持續冷卻液供給，過熱或被摧毀會導致劇烈爆炸。
block.sfire-mod-fission-reactor.name = 裂變能量堆
block.sfire-mod-fission-reactor.description = 在內部製造真空區啟動鏈式反應收集大量能量。\n保證其所在地安全！被摧毀會導致巨大的能量在無約束的情況下釋放，對周邊地區造成嚴重損傷。
block.sfire-mod-arc-fission-reactor.name = 弧形裂變堆
block.sfire-mod-arc-fission-reactor.description = 在裂位能弧膜之中[stat]安全地[]進行強裂變反應，在短時間內強行撕裂出本應該緩慢釋放的放射能，這能夠在短時間內帶來極高的電能峰值，但並不適合作為大範圍長時間供能的主力設施。


#——牆壁——#
block.sfire-mod-steel-wall.name = 硬質鋼牆
block.sfire-mod-steel-wall.description = 攔截敵方火力，保護後方建築。\n一種廉價的快速防禦設施，承傷能力雖不如鈦牆，但其獨特的空心結構能更有效的阻隔輕型射彈帶來的影響。
block.sfire-mod-steel-wall-large.name = 大型硬質鋼牆
block.sfire-mod-steel-wall-large.description = 攔截敵方火力，保護後方建築。\n一種廉價的快速防禦設施，承傷能力雖不如鈦牆，但其獨特的空心結構能更有效的阻隔輕型射彈帶來的影響。
block.sfire-mod-influx-wall.name = 波能牆
block.sfire-mod-influx-wall.description = 收集敵人的攻擊能量，並在之後反射。\n可以阻擋光電武器。
block.sfire-mod-influx-wall-large.name = 大型波能牆
block.sfire-mod-influx-wall-large.description = 收集敵人的攻擊能量，並在之後反射。\n可以阻擋光電武器。
block.sfire-mod-explosive-armor.name = 爆炸裝甲
block.sfire-mod-explosive-armor.description = 抵擋一定傷害，被摧毀時發生爆炸。對附近一切目標造成小幅傷害並削減範圍內子彈的威力。
block.sfire-mod-explosive-armor-large.name = 大型爆炸裝甲
block.sfire-mod-explosive-armor-large.description = 抵擋一定傷害，被摧毀時發生較為大型的爆炸，對附近一切目標造成小幅傷害並削減範圍內子彈的威力。
block.sfire-mod-discfabric-wall.name = 裂位牆
block.sfire-mod-discfabric-wall.description = 在自身周圍打開一道力牆，力牆失效後能反射部分彈藥。
block.sfire-mod-fermium-wall.name = 鐨牆
block.sfire-mod-fermium-wall.description = 堅硬且緻密，耐溫差，耐酸鹼，耐打擊，絕對可靠。
block.sfire-mod-fermium-wall-large.name = 大型鐨牆
block.sfire-mod-fermium-wall-large.description = 堅硬且緻密，耐溫差，耐酸鹼，耐打擊，絕對可靠。
block.sfire-mod-fermium-auto-door.name = 鐨閘門
block.sfire-mod-fermium-auto-door.description = 堅硬且緻密，耐溫差，耐酸鹼，耐打擊，絕對可靠。\n在我方單位靠近時自動打開。
block.sfire-mod-complex-armor-wall.name = 複合裝甲牆
block.sfire-mod-complex-armor-wall.description = 能夠承受大量打擊並攔截光電武器，可以安置在水上。
block.sfire-mod-complex-armor-wall-large.name = 大型複合裝甲牆
block.sfire-mod-complex-armor-wall-large.description = 能夠承受大量打擊並攔截光電武器，可以安置在水上。
block.sfire-mod-energy-containment-unit.name = 能量核心收容塊
block.sfire-mod-armor-containment-unit.name = 模塊裝甲收容塊
block.sfire-mod-tayralloy-containment-unit.name = 泰勒合金收容塊
block.sfire-mod-container1.name = 紅集裝箱
block.sfire-mod-container2.name = 黃集裝箱
block.sfire-mod-container3.name = 綠集裝箱
block.sfire-mod-container4.name = 藍集裝箱

#——輔助——#
block.sfire-mod-nano-mend-projector.name = 奈米修復投射器
block.sfire-mod-nano-mend-projector.description = 間歇性為大範圍內的建築修復一定比例的耐久度，可以使用奈米核加快修復頻率。
block.sfire-mod-nano-regen-projector.name = 奈米再生器
block.sfire-mod-nano-regen-projector.description = 持續地為範圍內的建築提供緩慢修復，可以使用奈米核提升修復速度。
block.sfire-mod-nano-unit-regener.name = 奈米單位維護站
block.sfire-mod-nano-unit-regener.description = 持續性為一定範圍內的單位維修。
block.sfire-mod-nano-unit-regener.details = 隨著第一軍團行動的展開，大量由於廣寒無法及時提供支援而損傷的單位逐漸堆積，有效戰鬥力無法得到及時補充，奈米單位維護站應運而生，這有效解決了受損單位的大批量維修問題，同時其較高的成本也導致在部分資源緊缺地區難以部署，更多情況下依然是使用傳統維修節點對單位進行修復
block.sfire-mod-iron-curtain.name = 鐵幕力場引擎
block.sfire-mod-iron-curtain.description = 不穩定的實驗性防禦建築。\n消耗大量電力生成一個小範圍吉瓦級力場。\n使用泰勒合金以提升引擎功率上限。
block.sfire-mod-iron-curtain.details = 這種小型化的護盾技術在確保面積承傷能力的同時能夠提高局部的恢復速度，通常用於保護部分高價值目標。但缺點同樣顯著：持續高負荷運作導致的引擎過熱往往會需要更長時間來恢復運行，在力場護盾重新啟動之前的這段空檔期無論對引擎本體還是其所保護的高價值目標都是相當危險的
block.sfire-mod-iron-dome.name = 鐵穹力場引擎
block.sfire-mod-iron-dome.description = 大型穹頂發生器。\n消耗大量能量生成一個大範圍兆瓦級力場。保護其中的單位與建築不受到實彈傷害。
block.sfire-mod-iron-dome.details = 相較於鐵幕的針對重點保護，鐵穹引擎的研發方向是針對陣地的大範圍保護——這通常會消耗大量能量與資源——同時，更大的生效範圍意味著在相同時間內引擎會承受更多甚至飽和級的損傷，但大型引擎有充足的換熱面積，在擁有充足冷卻供應時更不容易過熱。\n在面對大規模攻防戰時，若鐵穹依然在運行，應在其接敵過熱之前為其提供足夠量的冷卻。
block.sfire-mod-front-line-core.name = 前哨核心
block.sfire-mod-front-line-core.description = 可拆除的前鋒核心，只提供最低限度的核心功能。
block.sfire-mod-front-line-core.details = 大型核心由於其笨重性並不適合也不方便在戰況緊張的前線佈設，而小型核心在戰鬥中卻又沒有足夠的生存性能，且防線距離核心區太遠便會承擔極大的資源壓力，一款輕便而堅實的小型擴展核心因此而生——它保留了物資轉運、區域監測、建造機部署等核心功能，模塊化設計允許其在時機合適時擴建為一座大型基地。
block.sfire-mod-industry-core.name = 勤務核心
block.sfire-mod-industry-core.description = 重型存儲核心，容量最大。
block.sfire-mod-industry-core.details = 正面戰場逐步擴大，老舊的終代核心已無法再適應日益險惡的前線環境\n“它甚至無法在破片紛飛的戰場上存活，何談予以前線支援”\n新型核心與新一代核心機的研發同步提上日程。\n第四代重型戰術核心由此而生，它能夠抵禦更多的攻擊，充足的存儲空間與新一代核心機能夠為附近任何防線提供足量的勤務支持。
block.sfire-mod-final-command-core.name = 最高指揮中心
block.sfire-mod-final-command-core.description = 戰區核心，裝甲厚重，提供更多單位容量。

#——單位工廠——#
block.sfire-mod-special-factory.name = 特種工廠
block.sfire-mod-special-factory.description = 研究、生產先進特殊戰鬥單位。\n可以承接倍乘級作戰單位訂單。
block.sfire-mod-special-factory.details = 由倍乘級單位重構工廠改造而來，設施較為完備，能夠以較快的速度構建第三級單位。同時承擔各種改裝測試任務與新興功能性單位製造。

block.sfire-mod-pentative-reconstructor.name = 泰特級單位重構工廠
block.sfire-mod-pentative-reconstructor.description = 在原有基礎構造之上升級護甲，能源，武器等方面。
block.sfire-mod-pentative-reconstructor.details = ■■部在■■■戰區遭受嚴重打擊，我們了解到現有武器裝備已經不足以支撐日益增長的各類任務。\n敵人的防線與軍工廠正在逐漸規模化，他們妄圖利用地緣優勢瓦解我們的進攻。\n這是必要的一步：升級裝甲、優化能源核心與分配系統、更有針對性的特化武備······泰特級作戰單位將成為立竿見影的破局之法，但並非是唯一的辦法

block.sfire-mod-terr-assembler.name = 闊野管理中心
block.sfire-mod-terr-assembler.description = 組裝闊野。
block.sfire-mod-elec-assembler.name = 電鱷組裝器
block.sfire-mod-elec-assembler.description = 組裝電鱷。
block.sfire-mod-payload-construstor.name = 收容塊構造器
block.sfire-mod-payload-construstor.description = 構造兩種收容塊。

#——單位——#
unit.sfire-mod-flareX.name = 麥芒
unit.sfire-mod-flareX.description = 發射追蹤飛彈，對地面目標投下燃燒彈。
unit.sfire-mod-flareX.details = [#a3ba73]溢裂數據庫已解碼：\n[]中型多用途戰鬥機。這奇異的外形之下隱藏著如此恐怖的機動性能，這可能是我們的雷達無法探測到它的原因之一？\n[red]一切尚不明確，我們需要更多數據······
unit.sfire-mod-electrodile.name = 電鱷
unit.sfire-mod-electrodile.description = 搭載三聯裝重型電漿砲，近地懸浮能跨越部分地形。
unit.sfire-mod-electrodile.details = [#a3ba73]溢裂數據庫已解碼：\n[]實驗型重型懸浮載具。從其內置系統與能量分配推測由雷鳴系列發展而來。後續的改進型號中增設短程推進系統，用於翻越中小型複雜地形。\n從中央數據庫獲取其藍圖後，逆向工程的瓶頸轉移到了能源與護甲系統上……
unit.sfire-mod-thunderclap.name = 霹靂
unit.sfire-mod-thunderclap.description = 搭載分裝式對地脈衝砲，對空中目標發射癱瘓性脈衝飛彈。
unit.sfire-mod-thunderclap.details = [#a3ba73]溢裂數據庫已解碼：\n[]重型火力投送空艇。儘管其內部設備已經大幅改動，但依然可以看出其師承雷鳴一脈。\n[black]看起來像是技術成熟的種類
unit.sfire-mod-knocker.name = 敲門磚
unit.sfire-mod-knocker.description = 步行爆破機甲，對目標發動毀滅性打擊。
unit.sfire-mod-knocker.details = [#a3ba73]溢裂數據庫已解碼：\n[]搭載高爆串聯戰鬥部，解除保險後發射。\n直接損毀小範圍建築並對殺傷範圍內的單位造成損傷，癱瘓大面積的修復裝置。
unit.sfire-mod-knocker-missile.name = 敲門磚

unit.sfire-mod-partiality-A.name = 偏袒-甲
unit.sfire-mod-partiality-A.description = 菁英機動反裝甲部隊。跨越大多數地形發動突襲。
unit.sfire-mod-partiality-B.name = 偏袒-乙
unit.sfire-mod-partiality-B.description = 菁英機動砲擊部隊。跨越大多數地形發動砲擊。\n對建築造成更多損壞。
unit.sfire-mod-partiality-C.name = 偏袒-丙
unit.sfire-mod-partiality-C.description = 菁英機動飛彈部隊。跨越大多數地形發射質子飛彈。\n對空軍造成更高傷害。
unit.sfire-mod-partiality-D.name = 偏袒-丁
unit.sfire-mod-partiality-D.description = 菁英機動勤務部隊。跨越大多數地形修復附近友方單位。\n攜帶[stat]主動式[]三疊內爆彈，[red]切莫使其接近防線！！！
unit.sfire-mod-partiality-D.details = 似乎使用某種特殊材質的機體外殼，會吸收一切頻段的能量並在某種條件下增強內部能量源



unit.sfire-mod-blade.name = 利刃
unit.sfire-mod-blade.description = 標準化輕型護航艦隻，搭載雷射照射砲與巡弋飛彈系統。\n能夠攔截臨近的實體彈藥並修復附近的單位。
unit.sfire-mod-blade-missile.name = 利刃飛彈
unit.sfire-mod-titan.name = 泰坦
unit.sfire-mod-titan.description = 標準化重型地面戰鬥機甲，搭載中程大口徑霰彈砲與加農砲。\n能夠為附近的單位提供護盾與超頻。
unit.sfire-mod-vast.name = 滄海
unit.sfire-mod-vast.description = 標準化重型水面戰鬥艦艇，搭載複合垂直發射系統和短程雷射。\n能夠攔截臨近的實體彈藥。\n會針對難以消滅的目標發動飽和打擊。

unit.sfire-mod-伯勞.name = 伯勞
unit.sfire-mod-伯勞.description = 資訊缺失！
unit.sfire-mod-亞龍.name = 亞龍
unit.sfire-mod-亞龍.description = 資訊缺失！

#我方可用
unit.sfire-mod-ordinance.name = 立憲
unit.sfire-mod-ordinance.description = 攻擊附近所有敵人。發射巨型穿甲爆破彈與閃電鏈，穿透敵軍和建築。\n正面強攻與空降作戰的核心力量之一。
unit.sfire-mod-ordinance.details = 適者生存
unit.sfire-mod-libra.name = 地星
unit.sfire-mod-libra.description = 折躍能量炸彈砸向敵人造成嚴重破壞，對護盾殺傷力顯著。\n發射大型脈衝雷射束並修復友方建築。\n為臨近的友方單位提供強化。\n能跨越大多數地形。
unit.sfire-mod-libra.details =
unit.sfire-mod-agelenid.name = 盤龍
unit.sfire-mod-agelenid.description = 發射追蹤火箭與大量雷射，並在此過程中修復自己。\n能跨越大多數地形。
unit.sfire-mod-agelenid.details =
unit.sfire-mod-hepta.name = 廣寒
unit.sfire-mod-hepta.description = 修理友方單位並提供護盾，使用干擾能量場電擊附近敵人並發射切割光束。可以攜帶大型單位或方塊。
unit.sfire-mod-hepta.details =
unit.sfire-mod-sundown.name = 餘輝
unit.sfire-mod-sundown.description = 攻擊附近所有敵人。發射密集的帶電分裂彈，投送遠程巡飛彈。
unit.sfire-mod-sundown.details =
unit.sfire-mod-sundown-missile.name = 餘輝飛彈
unit.sfire-mod-dorudon.name = 滕王
unit.sfire-mod-dorudon.description = 攻擊附近所有敵人。發射密集的高爆飛彈與破片飛彈。搭載對護盾有強大破壞能力的裂位軌道砲。
unit.sfire-mod-dorudon.details =
unit.sfire-mod-cerberilla.name = 羅漢
unit.sfire-mod-cerberilla.description = 攻擊附近所有敵人。發射大量脈衝彈與震爆彈，對敵方供給鏈造成毀滅性打擊。\n保護並修復臨近的友方單位。
unit.sfire-mod-cerberilla.details =



unit.sfire-mod-vanguard.name = 衝鋒
unit.sfire-mod-vanguard.description = 向附近敵人發射大口徑子彈。
unit.sfire-mod-vanguard.details = 造價低廉，機動性優良，常被用於火力偵查。\n為了保留其高機動性，我們不得不捨棄了大口徑反建築彈藥，但在面對敵方單位時依然具有一定的生存能力。
unit.sfire-mod-striker.name = 突襲
unit.sfire-mod-striker.description = 發射高爆火箭，重裝速度較慢。\n密封艙室，可以跨越水域。
unit.sfire-mod-striker.details = 兼備機動與火力，能夠快速從多方位突入戰場支援。\n——“唯一的缺點是不能跨越山脈”\n——“那為什麼不使用空軍呢？”
unit.sfire-mod-skyfire.name = 轟炸
unit.sfire-mod-skyfire.description = 向遠程地面目標發射12枚高爆火箭彈，對建築破拆效果極佳。
unit.sfire-mod-skyfire.details = 一款經典的遠程火力投送方案，儘管其設計來自遠古年代，但結構簡單投送能力強悍使得它依然活躍在戰場一線。\n發射前需要架起，注意提防敵人的遠程打擊與空中力量！\n“浪漫而致命”
unit.sfire-mod-flanker.name = 反擊
unit.sfire-mod-flanker.description = 發射反裝甲衝擊彈。\n能夠碾壓建築。
unit.sfire-mod-flanker.details = 過去用於搭載光稜攻城平台的底盤因系統兼容性極差且能耗較高導致機體臃腫，如今被用於搭載反裝甲武器。這門中口徑高倍身管砲能有效擊碎敵人與護盾，但這種彈藥並不適合用於打擊建築裝甲，面對敵方火砲陣地時請注意規避。
unit.sfire-mod-executioner.name = 斬首
unit.sfire-mod-executioner.description = 發射大口徑氚芯聚爆彈引起二次爆炸。\n能夠碾壓建築。\n優先攻擊核心。
unit.sfire-mod-executioner.details = 優秀的機動底盤與足夠大的車身容積令其能適配多種多樣的武器配置，這台坦克身上曾經裝載過許多武器：雷射照射砲、電磁砲、聚變加農砲，但僅使用雷射照射砲的版本由於其不堪入目的對單位命中與殺傷性能以及巨大能耗所致的低下機動性而十分容易被空軍部隊所擊毀。經戰損數據對比，所有搭載雷射照射砲的斬首被全部改為聚變加農砲，附加一對同軸雷射發射器，並將此版本作為所有同系坦克的默認出廠設置。
unit.sfire-mod-enforcer.name = 平定
unit.sfire-mod-enforcer.description = 發射遠程穿甲震撼彈。\n能夠碾壓建築。
unit.sfire-mod-enforcer.details =

unit.sfire-mod-convection.name = 多雲
unit.sfire-mod-convection.description = 發射磁擾波束。
unit.sfire-mod-convection.details =
unit.sfire-mod-sleet.name = 霜雪
unit.sfire-mod-sleet.description = 發射冷凍光束，拖延敵人行進並造成些許傷害。
unit.sfire-mod-sleet.details =
unit.sfire-mod-cumulus.name = 燃空
unit.sfire-mod-cumulus.description = 發射高能光束與燃燒飛彈。
unit.sfire-mod-cumulus.details =
unit.sfire-mod-circulation.name = 颶風
unit.sfire-mod-circulation.description = 發射密集的能量彈與震爆彈。
unit.sfire-mod-circulation.details = ——戰鬥性能評估報告——\n“由兩台颶風組成隊伍能夠有效截殺大部分移動目標或將建築集群夷為平地，但卻不能有效應對高護甲目標，在遇到擁有對空火力或者重型裝甲目標時應當儘快撤離，避免更多不必要的損失。”
unit.sfire-mod-cirrus.name = 雷暴
unit.sfire-mod-cirrus.description = 發射磁爆能量彈與雷雨生成器。擁有小型護盾發生器。
unit.sfire-mod-cirrus.details = 大量能量在一定區域內快速爆發對於力場發生器的損傷是毀滅性的，但對接地的重型建築效果不好，在雨天能發揮對部隊的最高殺傷性能
unit.sfire-mod-stratosphere.name = 地動
unit.sfire-mod-stratosphere.description = 投下電默彈與攻頂燃燒彈。配備防空冷凍光束。\n可以攜帶單位進行空降作戰。

unit.sfire-mod-alnitak.name = 參宿
unit.sfire-mod-alnitak.description = 發射小口徑砲彈和中程制導魚雷。
unit.sfire-mod-alnitak.details = 機動性能優秀，常作為海岸巡邏隊，能夠高效清理落單的敵方船隻或其他小型目標
unit.sfire-mod-polaris.name = 北斗
unit.sfire-mod-polaris.description = 發射衝擊束，使用汲取光束修復自身。\n配備巡航系統，擁有更大的視野範圍。
unit.sfire-mod-polaris.details =
unit.sfire-mod-antares.name = 羅星
unit.sfire-mod-antares.description = 搭載通用垂直發射單元，發射小型質子砲彈與彈道飛彈。
unit.sfire-mod-antares.details = 發現敵人並不能完全確保場面控制權在你的手上，羅星所搭載的強勁的能源系統與以及優秀的火控雷達使得它能快速響應到任何一個位置去，無論其任務是防空還是反艦
unit.sfire-mod-merak.name = 天罡
unit.sfire-mod-merak.description = 重型防空艦艇。\n發射密集的防空飛彈和質子砲。
unit.sfire-mod-merak.details = 其強大的能量核心與火控分配使得它成為了第一代質子砲“漫遊”的最佳實驗平台，即使是重型空中目標也無法抵擋質子砲的撞擊與防空飛彈所致海量損傷。
unit.sfire-mod-regulus.name = 玄冥
unit.sfire-mod-regulus.description = 發射大型質子魚雷與質子砲。攜帶三對全自動飛彈發射器。
unit.sfire-mod-regulus.details = 某些型號曾被用於搭載戰術彈道飛彈，但受制於平台潛力以及高昂成本而無法大規模使用。\n隨著某重型彈道飛彈的研發列裝而逐漸退出現役
unit.sfire-mod-alioth.name = 重堂
unit.sfire-mod-alioth.description = 發射氘芯彈與高聚氚芯脈衝彈，對敵電子設備造成嚴重傷害。
unit.sfire-mod-alioth.details = 以“光陰”為首的一批尖端科技——第三代質子砲的殺傷性能十分顯著，但它因為能耗過高而無法批量列裝與移動平台上。\n而裂位引擎小型化使得第四代試驗性質子聚變武器能夠實現並搭載在移動平台上，甚至有多餘能量分配給已經小型化的第二代質子砲系統。\n作為新一代遠程重火力支援艦，其機動性能堪憂，儘量不要讓它暴露在敵人的直接攻擊下。

unit.sfire-mod-tadpole.name = 呲蜉
unit.sfire-mod-tadpole.description = 用於小型載荷與物資的搬運。
unit.sfire-mod-tadpole.details = 第一代小型反重載具，顯然引擎強度略高於設計指標，這導致它並未能按計劃以近地懸浮行駛反而高高飛起。\n充足的改裝預留空間可以被用於後續改裝搭載各類設備，但鑑於這一代設計已定型，遂用於搬運物品、作戰單位甚至輕型建築
unit.sfire-mod-dendrobate.name = 箭毒
unit.sfire-mod-dendrobate.description = 向附近的目標噴灑強酸，腐蝕目標。
unit.sfire-mod-dendrobate.details = 這是首次將酸液直接搭載在作戰單位上使用，它對建築的殺傷性能簡直可以忽略不計，但對其他作戰單位的護甲與各種鉸接部位的殺傷性能異常優良，加之兩棲移動的機動性使得它們迅速成為炙手可熱的輔助作戰配置。\n鑑於其對建築傷害微乎其微，在緊急情況下可以利用這些液體去撲滅火焰，儘管後勤部門並不推薦這麼做
unit.sfire-mod-bombina.name = 鈴蟾
unit.sfire-mod-bombina.description = 發射粘性奈米炸彈，若沒有粘附到目標則不會發生爆炸。
unit.sfire-mod-bombina.details = 新一批奈米武器搭載了智能彈頭，它們只會專注於分解敵人或修復己方建築其中的一種，由磁性引信統一調控。
unit.sfire-mod-bullfrog.name = 牛蛙
unit.sfire-mod-bullfrog.description = 搭載兩門自動霰射防空砲，同時使用一門酸蝕機槍攻擊附近的目標。
unit.sfire-mod-bullfrog.details = 作為現役專職制空艦的天罡其作戰性能固然強大，但只能在海上提供空中防護，這使得部隊登陸作戰不得不被敵方空中重火力所威脅。作戰部隊急需一種高機動性的兩棲支援單位，牛蛙載具強勁的懸浮引擎使得它能夠在攜帶重武器的情況下快速機動伴隨主力作戰。
unit.sfire-mod-salamander.name = 蠑螈
unit.sfire-mod-salamander.description = 發射磁擾波束與穿甲內爆彈，快速破除護盾，同時對重甲、大體積目標有更高殺傷效率。
unit.sfire-mod-salamander.details =
unit.sfire-mod-gharial.name = 巨鱷
unit.sfire-mod-gharial.description = 短暫充能後發射強大的離子砲，需要時間鎖定目標，免疫絕大多數物理異常狀態效果。
unit.sfire-mod-gharial.details = 代號“多智龍”的兩棲作戰系統與“乳齒象”的移動式熱浪項目各自取得成功，其研發成果後用於建造此項目。\n其搭載的輕型移動式熱浪軌道砲威力得以最大程度保留，作為重型攻城載具，武器的輸出功率進行了調整使得它能快速熔化敵軍建築或者裝甲。

unit.sfire-mod-space-missile.name = 反艦飛彈 I 型
unit.sfire-mod-space-missile.name = 反艦飛彈 II 型

unit.sfire-mod-arma.name = 兵刃
unit.sfire-mod-arma.description = 中堅戰鬥艦船，這將是你的長期主力戰艦。\n發射反艦飛彈或高斯砲來攻擊附近的敵人。\n可以攔截敵方飛彈。
unit.sfire-mod-bifurca.name = 雙股
unit.sfire-mod-cinnabar.name = 紅纓

unit.sfire-mod-piercer.name = 穿行
unit.sfire-mod-piercer.description = 高速偵察艦船，犧牲部分防禦力量換取更高的速度。\n發射反艦飛彈或高斯砲來攻擊附近的敵人。\n可以攔截敵方飛彈，[red]但效率較低[]。
unit.sfire-mod-permeater.name = 滲透
unit.sfire-mod-phantom.name = 幻影

unit.sfire-mod-vagris.name = 定遠
unit.sfire-mod-vagris.description = 重型火力支援艦船，搭載大量彈藥並攜帶單體護盾。\n發射反艦飛彈或高斯砲來攻擊附近的敵人。\n可以攔截敵方飛彈。
unit.sfire-mod-concord.name = 致和
unit.sfire-mod-ewer.name = 方尊

unit.sfire-mod-shatter.name = 摧堅
unit.sfire-mod-shatter.description = 火力突襲艦船，搭載更多彈藥，擁有更高的火力密度。\n發射反艦飛彈或高斯砲來攻擊附近的敵人，[red]但發射角度固定[]。\n可以攔截敵方飛彈。
unit.sfire-mod-siege.name = 破城
unit.sfire-mod-remnant.name = 殘垣




unit.sfire-mod-assembler-drone.name = 組裝無人機
unit.sfire-mod-assembler-drone-large.name = 大型組裝無人機
unit.sfire-mod-armed-drone.name = 默途
unit.sfire-mod-armed-drone.description = 搭載4門並列脈衝槍，自主偵察推進並攻擊附近所有敵人。\n擁有一個護盾發生器。
unit.sfire-mod-armed-drone.details = 中型查打一體作戰單位。作為廉價的突進部隊來說，它足夠優秀；作為戰鬥單位來說，它太過脆弱。妥善利用它的偵察設備為戰局掌握更多主動性。

unit.sfire-mod-farmer.name = 工農
unit.sfire-mod-farmer.description = 自動重建損壞的建築並攻擊靠近的敵人。發射癱瘓雷射與奈米彈。修復附近的友方單位。
unit.sfire-mod-farmer.details = [lime]工農武裝割據！[]\n為適應泰伯利亞戰場複雜環境而打造的一代全能勤務艦隻，搭載“紅星”核心系統，能夠自動適應各種任務的行為操控與能源分配。
unit.sfire-mod-carrier.name = 群眾
unit.sfire-mod-carrier.description = 提供更強大的戰場運載能力。\n搭載短程強酸噴槍。
unit.sfire-mod-carrier.details = 由原型工農改造而來的一型僅執行載荷運載任務的勤務艦隻，搭載“紅星-乙”核心操控系統。\n[red]拋棄武器系統與火控雷達[]使飛控系統能精準分配動力能源。


unit.sfire-mod-flamer.name = 鍛火
unit.sfire-mod-flamer.description = 裝載爆燃切割槍與礦渣榴彈拋射器。\n攻擊會點燃目標並對建築造成較大損害。
unit.sfire-mod-thunder.name = 雷鳴
unit.sfire-mod-thunder.description = 發射脈衝彈與閃電發生器。\n護甲厚重但本體略為脆弱，注意規避敵重型防空火力。
unit.sfire-mod-banisher.name = 竭澤
unit.sfire-mod-banisher.description = 發射小型雷射和定向衝擊彈。\n為附近的單位提供保護。\n能夠跨越水域。
unit.sfire-mod-banisher.details = “長弓”實驗平台的使命自海軍武備完成整改而結束，憑藉其優秀的基礎設計所積攢下的海量數據與可行性方案是一筆無盡的財富，而這便是它所能為我們帶來的最後一份禮物——\n繼承了其能源體系發展而來，在數個特種機械中擁有最遠主砲殺傷距離與最強雷射攔截性能的泛用性兩棲砲艇
unit.sfire-mod-hammer.name = 攻城錘
unit.sfire-mod-hammer.description = 向地面目標發射大口徑榴彈砲。\n能夠跨越大部分固態地形。
unit.sfire-mod-hammer.details =

unit.sfire-mod-terrascape.name = 闊野
unit.sfire-mod-terrascape.description = 投送超載引力發生器與光子飛彈。間歇性發射衝擊束，配備空域靜電場。
unit.sfire-mod-terrascape.details = 對敵戰線越來越廣闊，每次行動所遭遇的敵對勢力越來越強大，闊野的出現幾乎解決了所有難題。作為一支全能戰艦，無論是攻城還是破軍，他無所不能。\n凶悍的火力與極強的建造、保護能力使得他完全足以獨當一面。\n同時其過高的耗材與巨大的維護消耗成為了後勤的一大考驗，目前僅有第五軍團擁有批量派遣闊野的能力。
unit.sfire-mod-stardust.name = 碎辰
unit.sfire-mod-stardust.description = 只攻擊指定目標，發射超視距彈道能量彈，[gold]有機率強行突破力場直接攻入內部。[gray]裝甲厚重但幾乎沒有近戰自保能力。
unit.sfire-mod-tau.name = 陶
unit.sfire-mod-tau.description = 保護勤務核心。\n建造能力最強，可以開採四級礦石。\n發射短程奈米蜂巢飛彈攻擊敵人或修復建築。
unit.sfire-mod-tau.details = 正面戰場逐步擴大，老舊的伽馬已無法再適應日益險惡的前線環境\n“它甚至無法在破片紛飛的戰場上存活，何談予以前線支援”\n新型核心與新一代核心機的研發同步提上日程。\n以工農為原型，搭載“紅星-甲”核心操控系統，重置了武器採礦建築等方面能量分配的改進型“民兵”被選中成為新一代核心機並正式列裝，代號“陶”。
unit.sfire-mod-omega.name = 歐米茄
unit.sfire-mod-omega.description = 保護最高指揮中心。\n擁有快速建造能力。\n發射穿甲燃燒彈與飛彈。
unit.sfire-mod-omega.details = 我們先進的歐米茄戰鬥核心機早已超越了老式的Glaive戰艇

unit.sfire-mod-UTV.name = 兩棲裝甲運載車
unit.sfire-mod-UTV.description = 運載大量物品。\n配備質子衝擊槍可以快速使護盾破損，全密封重裝甲。\n可以跨越非固體地面。
unit.sfire-mod-UTV-Artillery.name = 質子榴砲運載車
unit.sfire-mod-UTV-Artillery.description = 使用裝甲運載車作為底盤，並放棄一切載貨容量轉為一門質子榴彈砲以及奈米修復系統。\n無法跨越非固體地面。\n[stat]強大遠程地面支援能力。
unit.sfire-mod-UTV-Command.name = 戰地指揮車
unit.sfire-mod-UTV-Command.description = 使用裝甲運載車作為底盤，並放棄一切載貨容量轉為搭載小型車載雷達，其擁有更廣闊的視野。負責作戰指揮或指引砲火打擊。\n可以跨越非固體地面。\n[red]被摧毀會導致我們丟失該地區的戰場控制，務必保護！
unit.sfire-mod-UTV-Defense.name = 防禦擴展運載車
unit.sfire-mod-UTV-Defense.description = 使用裝甲運載車作為底盤，並放棄一切載貨容量轉為一座點防禦系統以及小型力場發生器。\n可以跨越非固體地面。\n[stat]提供中程實彈防禦與近程護盾。
unit.sfire-mod-UTV-Missile.name = 防空飛彈運載車
unit.sfire-mod-UTV-Missile.description = 使用裝甲運載車作為底盤，並放棄一切載貨容量轉為一台四聯裝飛彈發射器以及奈米修復系統。\n可以跨越非固體地面。\n[stat]強大中程防空能力。

