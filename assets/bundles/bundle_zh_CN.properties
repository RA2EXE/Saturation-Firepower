#——物品——#
item.sfire-mod-strontium.name = 锶
item.sfire-mod-strontium.description = 易燃金属元素，用作反应装甲，特殊战斗部以及引火组件。
item.sfire-mod-strontium.details = 化学性质过于活泼，略微受热就会立刻剧烈氧化燃烧。在真空环境中相当稳定，但可以通过掺入其他物质来形成特殊杀伤性战斗部
item.sfire-mod-rubidium.name = 铷
item.sfire-mod-rubidium.description = 优质天然强电磁性能金属，这使它能应用到一些高危的流体工业中去。用作大型磁搅拌子、阻滞锁定器等磁性部件。
item.sfire-mod-rubidium.details = 据说这玩意的单质与某种恒星终点物质混合后会对机械体产生极大的影响\n——有待考证
item.sfire-mod-fermium.name = 镄
item.sfire-mod-fermium.description = 用于高耐用结构与高抗热装甲，穿透性化学燃烧弹药与裂变燃料。
item.sfire-mod-fermium.details = 泰伯利亚上的稀有金属，致密坚硬。具有放射性，这可能对周边环境造成一定影响，但在这颗星球上已经无所谓了
item.sfire-mod-chromium.name = 铬
item.sfire-mod-chromium.description = 质地坚硬但带有部分脆性，常用于高等金属加工或重型碎甲弹。
item.sfire-mod-chromium.details = 最坚硬的金属元素，呈现出坑洼的微观表面结构，部分设备指标只能由该元素相关制品补齐且暂无可替代物质，这通常会极大地延长设备的建造周期
item.sfire-mod-rare-earth.name = 稀土
item.sfire-mod-rare-earth.description = 用于提炼多种稀有金属元素或多孔吸附填料。
item.sfire-mod-rare-earth.details = 曾经，这些元素相当稀有且通常混杂于硅酸盐类杂质中难以提炼；虽然此处元素丰度相当之高，但由于其在地表总含量较低，“稀土”这一名称依然被沿用至今
item.sfire-mod-crystal-gallium.name = 镓晶
item.sfire-mod-crystal-gallium.description = 过冷制成固态的镓。用于制造先进电气元件，柔性结构，导热器以及特殊保护涂层。
item.sfire-mod-crystal-gallium.details = 常态下呈现出液态的一种金属物质，熔点较低但沸点极高，其以单质形式存在时的晶构十分稳定难以通过简单的加热而破解。高纯情况下有明显过冷趋势，可被强制冷却定向转化为固态稳定结构晶体。

item.sfire-mod-silisteel.name = 磁钢
item.sfire-mod-silisteel.description = 具有低电通率、高导磁性能和一定可塑性的廉价合金。用途广泛。
item.sfire-mod-wavesteel.name = 波纹钢
item.sfire-mod-wavesteel.description = 高性能轻型结构材料，在较大的温度范围内依然可以保持强度使用一段时间后不出现疲劳现象。用途广泛。
item.sfire-mod-wavesteel.details = [gray]这可比莱普便宜多了[]这种温压挤压工艺与流体腐蚀带来的奇特表面纹理，得名波纹钢
item.sfire-mod-cluster-bomb.name = 聚合炸药
item.sfire-mod-cluster-bomb.description = 仅用作武器弹药。可燃、易爆。
item.sfire-mod-cluster-bomb.details = 一种基于硝基化有机质的先进高性能炸药，构造方案通用多种不同材料，但他们无一例外都由一种高燃烧性材料充当助燃剂并由其余高爆材料组成主要战斗部，其爆炸速度与质能当量相较于老款爆炸混合物有显著提升。

item.sfire-mod-discordance-fabric.name = 裂位能
item.sfire-mod-discordance-fabric.description = 高能量且不稳定物，用做远距离瞬间移动或高能破甲战斗部。\n与泰勒载体的能量容器高度亲和，可用于提升泰勒载体的能量密度。
item.sfire-mod-discordance-fabric.details = 在不封装的情况下通过阿尔法粒子持续照射轰击相织布来产生裂位能的第一代工艺使曾经制取过它的设备即使在停机后数月也会表现出剧烈致命的放射性会使附近的电气设备寿命严重下降以至于大规模裂位能产区附近方圆百里寸塔不生……\n好在第二代裂位能制取采用了高密度金属进行封装，此类问题已经得到解决\n[red]生产方无需对任何未经批准且没有相位能量工程师等相关人员陪同的状态下直接接触或操作裂位能封装外壳导致的放射杀伤、地域污染、相位撕裂等情况负责，一经发现请立刻上报并远离此地，等待相位应急处理组支援
item.sfire-mod-nano-core.name = 纳米核
item.sfire-mod-nano-core.description = 精细纳米材料，主要应用于各类应急修复、强化场合。
item.sfire-mod-nano-core.details = 纳米材料，伽马！
item.sfire-mod-lens.name = 异向晶
item.sfire-mod-lens.description = 用于高等级激光器或半导体光感元件。常见于武器级激光偏转器中。
item.sfire-mod-lens.details = 常态下呈现出各向异性的晶体，硬度较低且极度易碎。在特定能量引导下，其晶层结构可以受控变化。这一特性使得其光电性能无论是数值还是泛用性都远超那些单一用处的破烂高等光学晶体，这将会开创一个光电学的新时代，一个万能晶体的时代……\n或许我们应该考虑对这种成本高昂的晶体进行量产？
item.sfire-mod-tayrium-alloy.name = 泰勒合金
item.sfire-mod-tayrium-alloy.description = 致密坚硬，拥有极强电磁性能的合金。用于制造超级电容器或作为其他形式能量的载体。
item.sfire-mod-leippium-alloy.name = 莱普合金
item.sfire-mod-leippium-alloy.description = 相对硬度极高的合金。用于先进装甲，弹药与永久性建筑结构。
item.sfire-mod-leippium-alloy.details = 热不变形，冷不变硬，抗旱防潮，结实耐糙，酸碱不侵，绝对可靠
item.sfire-mod-memory-alloy.name = 记忆合金
item.sfire-mod-memory-alloy.description = 智能时空材料，柔韧、坚固、可控，用于先进自维持结构与柔性保护层。
item.sfire-mod-memory-alloy.details = 旧意义上的记忆金属因其在耐温性与抗腐蚀方面的缺陷而在泰伯利亚的战场上的表现甚至不如简单的塑钢结构，以至于一度人间蒸发。裂能运用上的进步让物质的存在第一次拥有了超越时间与空间的能力，基于相位科技的新一代记忆金属已不再受制于仅仅记住“空间”这一个形态，更能记忆“时间”的存在
item.sfire-mod-solid-fuel.name = 固化燃料
item.sfire-mod-solid-fuel.description = 被极度低温瞬间凝结的水-燃料气混合物，似乎没来得及扩散就被冻住了。\n需要二次加工才能使用。
item.sfire-mod-solid-fuel.details = 太空中怎么会有有机质呢？或许是曾经的化学火箭泄露，也有可能是来自某些有机体，最坏的打算便是曾有不少星舰陨落于此......

liquid.sfire-mod-nanofluid.name = 纳米流体
liquid.sfire-mod-nanofluid.description = 智能物质阻隔剂，参与生产加工或作为一次性的冷却机构。
liquid.sfire-mod-nitrated-oil.name = 硝化重油
liquid.sfire-mod-nitrated-oil.description = 主要用于工业生产提取其中的爆炸性物质。
liquid.sfire-mod-nitrated-oil.details = 物理稳定性极差，这种流体几乎不能承受常规冲击，生产或者加工过程中只能采取大型缓速搅拌器来同时确保安全与效率。在作为液态炸药时爆速极差且可能会对操作者造成伤害，通常不用于攻击型用途，但在销毁废旧物品方面有相当不错的实用性以及……观赏性
liquid.sfire-mod-actived-nanofluid.name = 活化纳米流体
liquid.sfire-mod-actived-nanofluid.description = 武器级纳米材料，会以极快的速度中和大范围内的纳米流体并对附近建筑造成许多伤害。\n即时生效，一旦被及时抑制则无法造成足够的伤害。
liquid.sfire-mod-nitrate.name = 硝酸
liquid.sfire-mod-nitrate.description = 强酸，用于金属刻蚀软化或作为武器弹药喷向敌人。
liquid.sfire-mod-blast-reagent.name = 爆破剂
liquid.sfire-mod-blast-reagent.description = 可塑形稳定爆炸体，用作冲压燃料或者填充爆炸性战斗部。
liquid.sfire-mod-mix-gas.name = 燃气
liquid.sfire-mod-mix-gas.description = 可燃气体，高纯度存储情况下不易爆，压缩后用于切割焊接等高温动火作业。
liquid.sfire-mod-mix-gas.detail = 传热能力差，且容易汽化。相关储罐常因为吸收太多热量无法及时逸散而导致气压型物理爆炸，而后金属撕裂的火花又会再一次导致化学爆炸，对于此类危险化学品应当采取压力容器存储，并存放在远离危险的地方。
liquid.sfire-mod-heat-changer.name = 相界面导热油
liquid.sfire-mod-heat-changer.description = 用作反应堆，炮台等的紧急散热。\n易燃。
liquid.sfire-mod-heat-changer.details = 冷却压缩燃气并使纳米机器人包围组分来提升其稳定性，并在受热时迅速崩解释放，通过相变挥发快速吸收热量并传递至空气中，但这种不可控的高速传热同样使得其在需要持续换热、大温差换热及需要精确控温换热的使用场景中表现不佳。

