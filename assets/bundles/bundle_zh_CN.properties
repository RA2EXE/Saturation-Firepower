#4*4
block.sfire-mod-fangtian.name = 方天
block.sfire-mod-fangtian.description = 向敌方战机发射两枚大装药量导弹或者动能杀伤弹。导弹离开雷达范围后可以继续飞行一段距离。
block.sfire-mod-fangtian.details = 标准地空导弹系统，带有主动制导雷达使得炮体本身能够独立对导弹进行目标分配和锁定，但相应的能耗会大幅增加。
block.sfire-mod-leizhenyu.name = 雷阵雨
block.sfire-mod-leizhenyu.description = 向地面目标发射远程高爆火箭，拥有末端制导系统。
block.sfire-mod-leizhenyu.details = 标准远程地地火箭系统，尽管已经扩建了一次炮体与弹药口径来提升弹药的基础携带力，但仍因需要维持在远程抛物弹道情况下的有效杀伤力而去除了末端制导以外的设备。
block.sfire-mod-dianmai.name = 电脉
block.sfire-mod-dianmai.description = 向目标所在区域传送一枚脉冲发生器，短暂充能后激活以实施区域封锁。
block.sfire-mod-dianmai.details =
block.sfire-mod-qingning.name = 清宁
block.sfire-mod-qingning.description = 抛射一对过载能量弹，对机械、电气装置造成严重损害，同时干扰敌人的武器系统。
block.sfire-mod-chongchao.name = 虫潮
block.sfire-mod-chongchao.description = 发射一对威力巨大的纳米子母弹，对沿途敌人造成杀伤并修复己方建筑，可提供一定量的超速。\n[stat]弹药会穿过力墙。
block.sfire-mod-chongchao.details = watch out the [green]flash!
#5*5
block.sfire-mod-relang.name = 热浪
block.sfire-mod-relang.description = 锁定充能后发射一道纯热能波束对直接命中的目标造成双倍伤害。\n对固定的目标杀伤效果优秀，并不擅长处理快速移动的目标。
block.sfire-mod-relang.details = 随着战事的进行，双方军工厂几近超负荷运作，防线压力大幅增加，我们正需这样一款维护简单威力强大的防御性炮台·······\n第二代热能离子轨道炮，代号“热浪”，能量武器化最原始最粗暴最有效的利用方式——通过强加热使空气电离而做到无需通过炮体本身附加介质情况下对目标输送杀伤能力。\n有个坏消息，[brick]敌人的研究似乎比我们的更先进。
block.sfire-mod-sizhao.name = 死诏
block.sfire-mod-sizhao.description = 打击低速重型目标或者远距目标。
block.sfire-mod-sizhao.details = 基于厄兆理论基础的二代工质轨道炮，泰勒载体的裂能容器使得更大规模的瞬发能量输出成为可能，但一味的增加口径与功率并非可取之道，这会导致更严重能量逸散与更低的能量利用率。即使裂能轨道在一定程度上可以降低因射程导致的杀伤性能损耗，过度依赖一种固定的炮火支援也难以在日后的战斗中发挥作用。
block.sfire-mod-sizhao.sfire-mod-discordance-fabric.info = 能量波束穿透敌人时会提升[stat]200%[]伤害，最高[stat]800%
block.sfire-mod-liemei.name = 裂梅
block.sfire-mod-liemei.description = 向远程地面目标抛射数枚重型集束炮弹，精度不佳，常用于一定范围内的覆盖性打击。\n[stat]弹药会穿过力墙。
block.sfire-mod-liemei.details = 地面重火力投送的最优选择，少量集中部署的裂梅便能压制一定规模的地面战场或将其用于关键隘口的炮火压制，但在同一运输链上部署过多会导致供应压力的严重增加\n谨慎选择其部署量和位置
block.sfire-mod-cuowei.name = 错位
block.sfire-mod-cuowei.description = 发射相位震荡弹或者裂能震荡弹，对护盾有极强破损效率。\n优先攻击高护盾目标。
block.sfire-mod-cuowei.details = 先进膜理论的相关研究表明：相似相溶原理并非只适用于宏观物理学，其是世间万物的共有属性。这意味着一切基于相位理论的防御体系皆可以被同波段武器共振失效，通过控制相织布的震荡属性并以质子包裹发射与护盾共振可以快速令护盾引擎过载，而能量密度更高的裂能弹头会直接破除护盾并造成额外伤害。
block.sfire-mod-cuowei.phase-fabric.info = 衰减目标剩余护盾的[stat]10%[]，分裂弹[stat]5%
block.sfire-mod-cuowei.sfire-mod-discordance-fabric.info = [stat]反转护盾[]并造成[stat]25%护盾值[]的额外伤害
#6*6
block.sfire-mod-dingdaer.name = 丁达尔
block.sfire-mod-dingdaer.description = 向敌方空中单位发射密集的穿透光束。持续开火时射速逐渐提高。
block.sfire-mod-dingdaer.details = 新材料的加入带来光学晶体突破，依赖工质的光热离子炮正在逐渐被这一类先进的猝发激光器所取代。有了老式能量武器的开发与应用经验，第三代光热学武器随之诞生，代号“丁达尔”的大口径激光防空设施便是其中的一员。它能精准有效地把敌机打成筛子，同时能对同属相位波段的力场护盾造成毁灭性打击。
block.sfire-mod-guangyin.name = 光阴
block.sfire-mod-guangyin.description = 发射由纯能量包裹的重氢弹，造成小型聚变爆炸。\n可以使用巨浪合金来更改弹头属性。
block.sfire-mod-guangyin.details = 即使无需工质的能量武器开发应用能为战局带来更多优势，这类大型化的质子撞击炮在战场上依然不可或缺，它们不同于“丁达尔”那类纯粹而精密甚至称得上“娇贵”的光学武器无法承受复杂的地面作战环境而只能抬高俯仰角专注于空中，皮实有效小型化的重氢聚变弹对环境的适应性更强，在兼顾地面与空中目标的同时能保证足量的杀伤效益。\n让氚核飞~
block.sfire-mod-cimai.name = 刺霾
block.sfire-mod-cimai.description = 发射相位波段级穿甲弹，需要固定种类的弹药供给。\n[stat]对任何可以被直接攻击的大型目标有相当高的毁灭效率。
block.sfire-mod-cimai.details = 相位能包裹的重型弹头在撞击目标时能暂时保持弹头不发生形变，并在撞击结束后的破甲毁伤阶段快速释放形变，这使得刺霾对越大体积的目标拥有越强大的毁伤性能，但这层能量膜也会使弹体受到极大的空间位移阻力。
block.sfire-mod-cimai.sfire-mod-chromium.info = 削弱目标并对大体型目标造成一定比例的额外伤害
block.sfire-mod-cimai.sfire-mod-leippium-alloy.info = 对大体型目标造成更高比例的额外伤害
block.sfire-mod-fengmang.name = 锋芒
block.sfire-mod-fengmang.description = 将液体转变为流离子态随光压喷向目标，急速压制目标的分子热运动能力。
block.sfire-mod-fengmang.details = 光推进动力学顶尖之作，基于裂能载体的物质传输技术，在保持物质的分子构造与物理性质的情况下与光子流束重整并通过光压推进，在有效射程内等价于开火即命中的无延迟高效杀伤方案。
#8*8
block.sfire-mod-yuanling.name = 怨灵
block.sfire-mod-yuanling.description = 向目标发射巨型被帽钝头弹，造成严重杀伤并击退敌人。
block.sfire-mod-yuanling.details = 标准化第五代大口径重型动能弹头防御武器，厚重的装甲与高装药量过威力弹使其拥有强悍的正面受敌与输出性能。\n维护简单的武器是复杂战场状况下的最优选择。怨灵虽建造消耗较高，但事实证明这种坚实的过冗余结构底座是一个正确的选择，它正在逐渐取代大部分武器成为当前也可能是以后大部分战场的中流砥柱。
block.sfire-mod-kuosan.name = 扩散轨道炮
block.sfire-mod-kuosan.description = 发射极具毁灭性的大范围集束炮弹或者重型护盾破除弹。
block.sfire-mod-kuosan.details = 一种实验性的新型装药方案：裂能引信战斗部能均匀的将爆炸能量散布到爆炸范围内，从而保护弹药的全向杀伤性避免因距离和阻挡导致的严重能量衰减。\n这也是一种极度危险的弹药方案，意味着能量将不再能精准聚集而是均匀分布，这可能对某些重型装甲目标失去有效杀伤性，但巨大的杀伤半径仍然使其值得一试。\n为什么不试试EU的连续轨道炮呢？
block.sfire-mod-kuosan.sfire-mod-discordance-fabric.info = 每次穿透提升[stat]50%[]伤害，没有上限
block.sfire-mod-poxiao.name = 破晓
block.sfire-mod-poxiao.description = 脆弱的激光发生器，短暂充能后发射一对强大的能量束。\n使用可替换一次性大型武器级光学棱镜来提升单发功率。
block.sfire-mod-poxiao.details = 一道光，划破夜空。多门破晓射击时的光芒足以照亮一片战区，同时会给电力系统带来极大负担，确保你的电网实时供应充足或提前建造更多的蓄电池。\n由于激光发生器所用棱镜需要循环使用以确保火力连续性，常态功率必定有所限制，但天才们想出了一种十分危险但有效的功率突破方案……类似于实弹武器的切换弹匣，他们选择切换破晓激光棱镜以此将棱镜功率提升到一个可怕的高度但不能有效抑制能量逸散，但这意味着需要消耗额外的资源去维护并替换因满载而寿命只有一次使用机会的激光发生器。
block.sfire-mod-kuosan.sfire-mod-lens.info = 将开火模式切换为需要蓄力的强力单发射击
block.sfire-mod-fenqing.name = 愤倾
block.sfire-mod-fenqing.description = 向敌人倾泻密集的电磁脉冲弹，瘫痪其系统功能并造成严重损毁。
block.sfire-mod-fenqing.details = 电磁学最新力作，孱弱无力的传统电能释放储存转化已成为过去式，在泰勒-相位能复合能量载体的帮助下能量的收放以及转化效率可以达到惊人的九成以上。但直接聚集纯粹的能量作为打击手段依然不是一个好主意，在弹药飞行途中维持其物理状态所消耗的能量实际上远大于释放在目标身上的能量，若要造成可观物理损坏还需经过一次电热转化实在是得不偿失，但我们依然可以通过提高能量输出功率将有效损伤全部用于破坏其内部系统来达成作战目的。
block.sfire-mod-zhulin.name = 竹林
block.sfire-mod-zhulin.description = 利用裂位能预设轨道后释放近炸游弋弹群进行轰炸。[red]需要大量电力与冷冻液支持运行！
block.sfire-mod-zhulin.details = [yellow]王 的 问 候 ！\n[]武器化并不是物流系裂能引擎该做的事，尤其是在较小范围内并行创建数百条无目标的轨道会消耗太多能量并逸散巨量热能，这些逸散的能量不仅无法回收利用甚至会对炮体结构产生不可预见的风险。\n但在见识过其杀伤投送性能之后，这些巨大的消耗是值得的……或许？
block.sfire-mod-luolong.name = 络龙
block.sfire-mod-luolong.description = 重型动能打击复合动力炮，十分擅长处理大型打击任务，对非第一个命中的目标造成双倍伤害。
block.sfire-mod-luolong.details = 驱动大型物体长程高速运动所需的动力是非比寻常的，但有了竹林的先例，针对裂能引擎的后续改进十分容易。基于能量覆层的空阻降低与途中加包技术已经十分成熟，即使是如此大的弹体也能被加速到高超声速并在撞击过程中撕裂一块碎片带着它继续撞向下一个目标，同时这种大型化的引擎所具备的超高输出功率会使得炮弹出膛时产生一道激波，这片激波甚至能对附近的目标造成伤害




block.sfire-mod-defense-platform-cannon.name = 爆能弹防御平台
block.sfire-mod-defense-platform-torpedo.name = 鱼雷防御平台
block.sfire-mod-defense-platform-nuke.name = 裂变导弹防御平台
unit.sfire-mod-defense-platform-nuke-missile.name = 核导弹
block.sfire-mod-defense-platform-laser.name = 激光防御平台
block.sfire-mod-defense-platform-missile.name = 防空导弹防御平台
block.sfire-mod-defense-platform-plasma.name = 热能轨道炮防御平台
#Experimental Thermal Railgun
#Vertical Launching System
block.lancer.details = 优化能量阀，升级激光发生器，增设电弧引信
block.swarmer.details = 适配更多弹药，优化结构以提升火力密度
block.fuse.details = 更强的透射聚焦棱镜与先进火控系统是个不错的选择，事实也证明确实如此。\n任何向小型化炮台上安装不稳定且具有安全隐患的裂能者应当被立即丢入相位空间中！\n[darkgray]下不为例
block.spectre.details = 第三代大口径物理实弹防御武器，先进水冷系统，适配不同口径炮管并使用全威力弹。\n“幽灵是个老伙计了”


#——钻头——#
block.sfire-mod-energe-drill.name = 压力电动钻头
block.sfire-mod-energe-drill.description = 基础电动钻头，体积较大。\n电网中可支配的富余电能愈多，其钻探速度愈快。\n当电网中的富余电力大于正常运行所需时钻头效率会逐渐提高。
block.sfire-mod-energe-drill.details = 显然碳素钻头的强度并不足以与放射性金属元素硬碰硬，但这将是电力应用探索之路上的重要一步。
block.sfire-mod-heavy-drill.name = 重型切削钻头
block.sfire-mod-heavy-drill.description = 使用速率较低但扭矩输出极大的电动引擎，搭配变速箱组将扭矩升到足够高以在坚硬的地层中快速开采更硬的矿石。\n需要更多时间启动钻头。\n当电网中的富余电力大于正常运行所需时钻头效率会逐渐提高。
block.sfire-mod-heavy-drill.details = 注意！使用高扭矩钻头进行低硬度开采是一种极为不明智的方法！\n请分辨并选择正确的钻头种类来开采资源！
block.sfire-mod-blast-ore-well.name = 爆破钻井
block.sfire-mod-blast-ore-well.description = 向地层中注入液态炸药爆破采矿并以中等速度分批输出。\n[red]警告：严禁用于开采处于临界状态的放射性矿石！
block.sfire-mod-blast-ore-well.details = “高丰度镄矿脉进行向心爆破采矿测试，第三次，20%爆破剂接触，起爆！”\n“有效开采量低于预期，提高爆破剂接触率”\n“收到，高丰度镄矿脉进行向心爆破采矿测试，第四次，30%爆破剂接触，起爆！”\n......\n“开采量依然很低，真的还要再加吗？当前接触率下的风险系数已经很高了”\n“继续加吧...至少找到起爆临界值”\n“高丰度镄矿脉进行向心爆破采矿测试，第十三次，80%爆破剂接触，起爆！”\n*巨响\n录音结束\n那次爆破测试直接令直径120单位距离内一切物体[lightgray]灰飞烟灭[]。自此，高能放射性矿石被严禁使用任何强度的液态爆破采矿
block.sfire-mod-quantum-extractor.name = 量子提取机
block.sfire-mod-quantum-extractor.description = 直接从地下转移矿物。需要持续的冷却液供给，可以安置在水上。\n[red]此建筑已不再使用于战役，若用于作图可以自行DP调整数值。

block.sfire-mod-water-extractor.name = 重型抽水机
block.sfire-mod-water-extractor.description = 需要更多能源与时间来启动。
#block.sfire-mod-软流掘进机.name = 软流掘进机
#block.sfire-mod-软流掘进机.description = 耐高温处理强化钻头，放在高热的地形上可以钻探矿渣，需要一定时间启动。
#block.sfire-mod-软流掘进机.details = 请不要当绝地小子
block.sfire-mod-oil-pressure-pump.name = 岩隙压油塔
block.sfire-mod-oil-pressure-pump.description = 向含油地层中注入高压氮气来快速大量的提取石油。\n设计操作弹性极大，为避免不必要的浪费，请自行计算所需产能比例。
block.sfire-mod-oil-pressure-pump.details = 向岩层下方打入一条管道的过程中通过更高的流体压力反向顶回油压防止反冲的勘探式开采方案直到如今依然是一种有效且稳定的采油方案，即使这会导致更高的能耗与机械损耗，但比起这被机器源源不断带出地表的原油，那些微不足道的损耗完全可以忽略不计了
block.sfire-mod-gas-extractor.name = 岩隙提气机
block.sfire-mod-gas-extractor.description = 在含油裂隙上提取燃气，需要消耗电力。
block.sfire-mod-spore-cultivator.name = 温室培养皿
block.sfire-mod-spore-cultivator.description = 燃烧产生的气体成分似乎有利于孢子的生命活动，密闭的温室环境可以对其进行大批量的快速繁殖。
#——物流——#
block.armored-conveyor.details = 可以安置在水上
block.sfire-mod-wavesteel-conveyor.name = 波动传送带
block.sfire-mod-wavesteel-conveyor.description = 向前方运输物品，比钛传输带快一倍。\n可以安置在水上。
block.sfire-mod-wavesteel-junction.name = 波动交叉器
block.sfire-mod-wavesteel-junction.description = 向前方运输物品，允许传送带穿过它交叉运输，比交叉器快一倍。\n可以安置在水上。
block.sfire-mod-wavesteel-bridge.name = 波动传送带桥
block.sfire-mod-wavesteel-bridge.description = 跨越任何地形向前方运输物品，比钛传输带快一倍。\n可以储存少量物品\n可以安置在水上。
block.sfire-mod-complex-armored-conveyor.name = 复合装甲传送带
block.sfire-mod-complex-armored-conveyor.description = 快速地在战场运输物品，不接受边上的输入，已做水密封处理，耐高温且绝缘。
block.sfire-mod-silisteel-conveyor.name = 磁钢传送带
block.sfire-mod-silisteel-conveyor.description = 提供较大批量打包物品进行运输，通电加速运行。\n可以安置在水上。
block.sfire-mod-discfabric-bridge.name = 裂位物品传送塔
block.sfire-mod-discfabric-bridge.description = 跨越任何地形传送物品，比布桥更快，更远。
block.sfire-mod-discfabric-massdriver.name = 裂位驱动器
block.sfire-mod-discfabric-massdriver.description = 超远距离发送物品包，收集一定物品后将其发射到另一个裂位驱动器中。\n最低发射容量：60

block.sfire-mod-molecular-database.name = 分子数据库
block.sfire-mod-molecular-database.description = 掌握分子碎裂重组技术，有效填充仓库空间。
block.sfire-mod-hyper-unloader.name = 高速卸载器
block.sfire-mod-hyper-unloader.description = 从附近的容器中卸载物品，比普通卸载器更快。
block.sfire-mod-large-launch-pad.name = 大型发射台
block.sfire-mod-large-landing-pad.name = 大型接收台

block.sfire-mod-space-duct.name = 太空管道
block.sfire-mod-space-duct.description = 用于在失重环境下稳定输送物品。\n[red]这一套物流组件后续会用在空天军中，期间有任何bug或者优化需求请提出。
block.sfire-mod-space-router.name = 太空路由器
block.sfire-mod-space-router.description = 向其他三方向平均分配物品，同时提供分类器功能。
block.sfire-mod-space-unloader.name = 太空管道卸载器
block.sfire-mod-space-unloader.description = 卸载后方容器内指定物品并向前输出。
block.sfire-mod-space-bridge.name = 磁导空间桥
block.sfire-mod-space-bridge.description = 用于在太空中定向输送物品。\n可以被太空管道卸载器提取物品。
block.sfire-mod-space-bridge-long.name = 加强磁导空间桥
block.sfire-mod-space-bridge-long.description = 用于在太空中定向输送物品，需要少量电力维持运行。\n可以被太空管道卸载器提取物品。

block.sfire-mod-space-conduit.name = 太空加压流体管
block.sfire-mod-space-conduit.description = 用于在太空环境中输送流体。\n[red]这一套物流组件后续会用在空天军中，期间有任何bug或者优化需求请提出。
block.sfire-mod-space-liquid-router.name = 太空加压流体路由器
block.sfire-mod-space-liquid-router.description = 向其他方向平均分配流体。
block.sfire-mod-space-liquid-junction.name = 太空流体交叉器
block.sfire-mod-space-liquid-junction.description = 用于液体管道交叉通过。
block.sfire-mod-space-liquid-bridge.name = 磁导空间流体桥
block.sfire-mod-space-liquid-bridge.description = 用于在太空中定向输送流体。
block.sfire-mod-space-liquid-bridge-long.name = 加强磁导空间流体桥
block.sfire-mod-space-liquid-bridge-long.description = 用于在太空中定向输送流体，需要少量电力维持运行。
#——液流——#
block.impulse-pump.details = 加量不加价，效率更高60%！
block.plated-conduit.details = 可以安置在水上
block.sfire-mod-silisteel-conduit.name = 磁钢导管
block.sfire-mod-silisteel-conduit.description = 真空双层加固内胆，以高压传输液体。\n[red]易碎，不要磕碰。
block.sfire-mod-complex-armored-conduit.name = 复合装甲导管
block.sfire-mod-complex-armored-conduit.description = 快速地在战场输送液体，不接受边上的输入，已做水密封处理，耐高温且绝缘。
block.sfire-mod-silisteel-bridge-conduit.name = 磁钢导管桥
block.sfire-mod-silisteel-bridge-conduit.description = 真空双层加固内胆，以高压传输液体。\n跨越任意地形传输液体。
block.sfire-mod-silisteel-tank.name = 磁钢储液罐
block.sfire-mod-silisteel-tank.description = 双层中空绝缘外壳，可以更安全地储存大量危险液体。
block.sfire-mod-discfabric-liquid-bridge.name = 裂位导管塔
block.sfire-mod-discfabric-liquid-bridge.description = 跨越任何地形传输流体，比布桥更快，更远。
block.sfire-mod-tidal-pump.name = 潮汐泵
block.sfire-mod-tidal-pump.description = 究级液泵，引力工程学的奇迹。

#——生产——#
block.silicon-crucible.details = 升级高耐热外壳，优良热传导底座。得以更高的热转化效率。\n可以安置在液体上。
block.sfire-mod-crusher.name = 水压破碎机
block.sfire-mod-crusher.description = 大规模破碎废料为沙子，需要输入水和电力。
block.sfire-mod-crusher.details = ——电动机扭矩都不够用怎么办？\n——上液压机！
block.sfire-mod-large-melter.name = 大熔炉
block.sfire-mod-large-melter.description = 用于更大批量的熔化矿渣。当基础熔炉效率不再足够工业消耗之时，或许我们应该开发新机器？
block.sfire-mod-spore-compressor.name = 孢子冲压机
block.sfire-mod-spore-compressor.description = 双倍冲程，更高产能。
block.sfire-mod-flywheel-centrifuge.name = 飞轮离心机
block.sfire-mod-flywheel-centrifuge.description = 提取石油中的煤炭。
block.sfire-mod-flywheel-centrifuge.details = 开碳不规范，大哥低头转
block.sfire-mod-pyratite-blender.name = 硫捆合器
block.sfire-mod-pyratite-blender.description = 批量合成硫。
block.sfire-mod-blast-blender.name = 爆炸混合物捆合器
block.sfire-mod-blast-blender.description = 批量合成爆炸混合物。
block.sfire-mod-clus-blender.name = 炸药聚合器
block.sfire-mod-clus-blender.description = 将硫和爆炸混合物捆绑为聚合炸药。
block.sfire-mod-cryofluid-centrifuge.name = 冷冻液离心机
block.sfire-mod-cryofluid-centrifuge.description = 打碎钛粉分散入液相中制取冷冻液。
block.sfire-mod-plastanium-mutilcompresser.name = 复合塑钢压缩机
block.sfire-mod-plastanium-mutilcompresser.description = 扩大压缩主机规模，更加高效生产塑钢。
block.sfire-mod-surge-thermal-smelter.name = 温压合金冶炼炉
block.sfire-mod-surge-thermal-smelter.description = 使用废料和硅在高温高压炉内低效率地冶炼合金
block.sfire-mod-surge-electric-smelter.name = 电磁合金冶炼炉
block.sfire-mod-surge-electric-smelter.description = 磁钢的优秀磁电性能为高级磁热冶炼提供了硬件基础，这能更高效率并更多地冶炼合金。
block.sfire-mod-phase-activer.name = 归中激发器
block.sfire-mod-phase-activer.description = 以辐射赋予物质上形成相织布。
block.sfire-mod-phase-activer.details =

block.sfire-mod-silistell-smelter.name = 磁钢冶炼炉
block.sfire-mod-silistell-smelter.description = 将钛和硅冶炼为磁钢。
block.sfire-mod-silistell-smelter.details = 作为一种被大批量广范围应用的基础电气合金，由于初期研发工作的缺席使得大型冶炼器械被开发出来之前一直处于供不应求的状态，相较于独立设置工业区用于冶炼该金属后再经由物流系统分发至各处，更多情况下是由原料供应链或物资集散区旁使用这种小型冶炼器械就地生产以满足广域需求
block.sfire-mod-silistell-smelter-large.name = 磁钢冶炼厂
block.sfire-mod-silistell-smelter-large.description = 使用磁电科技改良冶炼工艺从而快速冶炼磁钢。
block.sfire-mod-silistell-smelter-heater.name = 磁钢热能高炉
block.sfire-mod-silistell-smelter-heater.description = 将钛和硅批量冶炼为磁钢。\n比磁钢冶炼炉更高效，需要大量热能供给。
block.sfire-mod-silistell-smelter-heater.details = 随着战线的深入，越来越多的钛矿与硅产能被划入磁钢的生产计划内，但磁钢的供给仍然极不稳定。无论是在后方或是前线，这种优良的电磁性能以及低廉的造价使得它被应用在几乎所有的地方。好在这种临时暴力搭建的冶炼高炉效率相当不错，这能一定程度上的降低后方磁钢产线的压力
block.sfire-mod-silistell-crucible.name = 磁钢再构炉
block.sfire-mod-silistell-crucible.description = 将铷和铬冶炼为磁钢。
block.sfire-mod-wavesteel-compresser.name = 波纹钢锻造机
block.sfire-mod-wavesteel-compresser.description = 将铬与铅锻造为波纹钢。
block.sfire-mod-wavesteel-forger.name = 软化锻钢机
block.sfire-mod-wavesteel-forger.description = 在硝酸的辅助下，将铬与铅锻造为波纹钢。
block.sfire-mod-wavesteel-forger.details = 比起“软化”更确切的来说是“溶解”，铬硬度过高，在能量供应不足的地区，除非采用几乎绝热封闭高炉，否则熔融锻造合金永远不是一个节能之迹
block.sfire-mod-metal-analyzer.name = 金属分析仪
block.sfire-mod-metal-analyzer.description = 经典重结晶，这种简单的方法能直接分离稀土中的简易材料。
block.sfire-mod-metal-precipitater.name = 稀土分析所
block.sfire-mod-metal-precipitater.description = 利用硝酸施加电场大批量地崩解稀土以快速分离其中的有效材料。\n[RED]测试中，后期数值可能发生更改
block.sfire-mod-gallium-supercooler.name = 镓晶过冷器
block.sfire-mod-gallium-supercooler.description = 自矿渣中提纯制造镓晶。
block.sfire-mod-gallium-supercooler.details = 熔融态金属杂质中镓含量虽然较低，但利用其独特的物理属性反复过冷熔化可令镓液析出而留下其他杂质，分离蒸汽并吸收后过冷制成晶体态单质镓
block.sfire-mod-nano-constructor.name = 纳米组装机
block.sfire-mod-nano-constructor.description = 机械组装构建可编程的用于各种方面的智械材料。
block.sfire-mod-nano-printer.name = 纳米打印机
block.sfire-mod-nano-printer.description = 纳米级3D打印可编程的用于各种方面的智械材料。
block.sfire-mod-lens-atomizer.name = 沉降造晶器
block.sfire-mod-lens-atomizer.description = 在负压惰性气体保护下对硅晶底片进行长时间的金属粒子掺杂沉降以制造纯净晶体。
block.sfire-mod-discfabric-phase-waver.name = 激发裂位放射塔
block.sfire-mod-discfabric-phase-waver.description = 使用裂能框架镄核载体的的定向粒子流束代替α粒子流。\n这会导致镄的强烈衰变放出大量射线，务必做好冷却防护措施。
block.sfire-mod-discfabric-phase-knitter.name = 反射裂位聚合器
block.sfire-mod-discfabric-phase-knitter.description = 使用镄与稀土直接聚合裂位能。
block.sfire-mod-air-collector.name = 大气压缩机
block.sfire-mod-air-collector.description = 缓慢收集大气并压缩提取其中的氮气为可工业使用的规模。
block.sfire-mod-air-collector.details = 大气中的微量孢子也会随空气混入压缩机并成为产出之一，为保证空气压缩机的正常运行，请及时处理堆积的孢子
block.sfire-mod-air-cooler.name = 冷冻压缩机
block.sfire-mod-air-cooler.description = 使用冷冻液迅速降温并分离出氮气而不产生其他杂质。
block.sfire-mod-air-cooler.details = 基于热力卡诺循环热泵技术——以较低的能耗转移更多的热量——当然这是对于能量品级而言，使用冷冻液这种高品质冷源对换低位热能产生氮气虽能大幅节省能量，但等价位的电压缩机冷却性价比显然更高……
block.sfire-mod-nitrate-mixer.name = 电弧硝化室
block.sfire-mod-nitrate-mixer.description = 电解水得到氧气并与氮气在电弧室内合成硝酸。\n设计操作弹性极大，为避免不必要的浪费，请自行计算所需产能比例。
block.sfire-mod-nitrate-mixer.details = 氮氧电解化合，这一反应在过去曾被用于制造有机质助长剂，但由于其能耗过高，副反应难以控制被逐渐弃用。\n如今其中一种副反应被重新启用以制造这种强酸
block.sfire-mod-fractionator.name = 石油分馏塔
block.sfire-mod-fractionator.description = 分馏石油，产出燃气和少量煤炭。\n设计操作弹性极大，为避免不必要的浪费，请自行计算所需产能比例。
block.sfire-mod-fractionator.details = 随着先进化工学进步，石油产业的相关制程已不再需要强制部署全套处理设备，精准裂解-分馏工艺能直接将原油处理为目标产品。但部分难以裂解而无法利用的高碳组分依然会成为沉淀物输出，这是先进化工学的耻辱，终有一天会寻找到解决它的办法……
block.sfire-mod-oil-blender.name = 油料混合器
block.sfire-mod-oil-blender.description = 生产高性能导热油。
block.sfire-mod-chemical-silicon-smelter.name = 化学硅冶炼炉
block.sfire-mod-chemical-silicon-smelter.description = 使用燃气在高温条件下还原硅。
block.sfire-mod-blast-silicon-smelter.name = 爆破冲压炉
block.sfire-mod-blast-silicon-smelter.description = 利用爆炸冲压沙子冶炼硅。
block.sfire-mod-blast-silicon-smelter.details = 什么都贴只会害了你······
block.sfire-mod-nitrification-reactor.name = 硝化反应器
