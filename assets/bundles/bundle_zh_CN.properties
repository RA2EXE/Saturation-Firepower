block.sfire-mod-tayrium-smelter.name = 泰勒合金冶炼厂
block.sfire-mod-tayrium-smelter.description = 使用巨浪合金，磁钢冶炼泰勒合金。
block.sfire-mod-tayrium-crucible.name = 泰勒合金高炉
block.sfire-mod-tayrium-crucible.description = 使用锶，磁钢，硅冶炼泰勒合金。
block.sfire-mod-tayrium-crucible.details = 直至此刻，你或许应该明白：泰勒合金不过是一个统称，一个“具有优良电磁性能”的合金方案的统称，也许物理应力性能不如老式配方，但这些合金最终追求的极致电磁性能已然达到预期，将其统一管理是降低勤务处压力的正确方案
block.sfire-mod-leippium-smelter.name = 莱普合金冶炼厂
block.sfire-mod-leippium-smelter.description = 使用镄，铬冶炼莱普合金。\n[darkgray]If u want it
block.sfire-mod-leippium-smelter.details = [darkgray]then u'll have to take it
block.sfire-mod-leippium-crucible.name = 莱普合金冲压炉
block.sfire-mod-leippium-crucible.description = 爆炸冲压成型莱普合金。
block.sfire-mod-leippium-crucible.details = 若当地能源已经不足以分配足够多的能源以支撑高能耗的热能冶炼炉的时候，或许爆炸冲压能够更加节省能量\n什么都贴只会害了你······等下，[#d97c7c]这是什么\n[darkgray]but u already knew that
block.sfire-mod-memory-locator.name = 记忆合金定位仪
block.sfire-mod-memory-locator.description = 生产记忆金属，一种先进智能材料。
block.sfire-mod-memory-locator.details = 基于纳米技术与裂能材料为金属打入“时空铆钉”，将材料的“初始形态”定义在此，随后可应用于各领域之中

