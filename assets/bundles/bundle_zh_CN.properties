block.sfire-mod-arc-synthesizer.name = 电弧合成炉
block.sfire-mod-arc-synthesizer.description = 将石墨与氢气合成燃气，需要提供能量。
block.sfire-mod-phases-converter.name = 三相转换室
block.sfire-mod-phases-converter.description = 使用机械手段与辐射辅助转化固态燃料并分离水和燃气。
block.sfire-mod-spectrum-waver.name = 波谱织机
block.sfire-mod-spectrum-waver.description = 使用镄负载拦截太空辐射收集相位能量。与地面上的设备工作原理相近，但不需要外部输入能量。

block.sfire-mod-vacuum-nano-printer.name = 真空纳米操纵仪//不用

#——电力——#
block.differential-generator.details = 得益于材料进步，我们能够用更少的材料控制更强大的燃烧、进行更大面积的换热、产出更多的电力……以及发生更危险的生产安全事故！
block.sfire-mod-armor-battery.name = 强化镀层电池
block.sfire-mod-armor-battery.description = 更安全的存储大量能量。
block.sfire-mod-armor-battery.details = 能量载体的不稳定缺点已被新进的结构设计所克服，通过安装更厚实的外部主装甲结构和优化电池内部的储能池结构设计在一定程度上抑制了裂位能泄露的强度。
block.sfire-mod-armor-node.name = 镀层装甲节点
block.sfire-mod-armor-node.description = 覆盖镀铬装甲的大型能量节点，提供更多的链接目标与略高的链接范围。\n可以放置在水上。
block.sfire-mod-discfabric-node-tower.name = 裂位能源塔
block.sfire-mod-discfabric-node-tower.description = 超远距离传输能量，提供3个链接。
block.sfire-mod-coal-pyrolyzer.name = 煤炭热解器
block.sfire-mod-coal-pyrolyzer.description = 使用水和高温热解气化煤炭，输出少量燃气。\n多余的气体将直接抛弃而不会造成堆积。
block.sfire-mod-coal-pyrolyzer.details = 由闪蒸技术发展而来的闪爆技术对于大块燃料来说并不能使其充分燃烧，但是在释压过程中喷洒水能让燃料块因热胀冷缩迅速崩解，立刻绝热加压可分解水与碳灰。该过程中释放的大量热量被用于涡轮机发电，其副产物燃气可用于多种工业场合
block.sfire-mod-gas-generator.name = 燃气发电机
block.sfire-mod-gas-generator.description = 回收多余燃气产生少量电能。
block.sfire-mod-gas-generator.details = 警告：使用煤炭热解并使用此机器回收燃气发电并不是一个明智的选择，尽管其能量密度略高于火力发电机，但该过程导致的能量损失是无法凭空产生的！\n“我现在十分怀疑你拿到这份工作所用工程学证书的种类以及学位证书的真实性”
block.sfire-mod-gas-turbine.name = 燃气轮机
block.sfire-mod-gas-turbine.description = 燃烧液体推动涡轮发电，需要时间预热，在全速运行时提供更多能量。
block.sfire-mod-gas-turbine.details = 纯物理性质的飞轮储能重型涡轮引擎发电机，单论发电效率及供电速度可能不如轻型的老一代涡轮发电机，但这使得它能抵抗EMP攻击，但新型的液态可控飞轮引擎使发电机运行过程中产生的能量会被尽可能多的转化为动能并产生更高能量，即使在燃料供应不足的情况下依然能持续运转一定时间
block.sfire-mod-ele-collector.name = 电子整流器
block.sfire-mod-ele-collector.description = 以酸液载体氢电刻蚀压电材料表面释放氢气，与此同时破坏晶格结构释放核子电弧引爆氢气冲压推动发电机。\n能产生大量的水。\n使用不同的金属衬底以[stat]提高对应比例效率。
block.sfire-mod-ele-collector.details = 我要一些孢子和馒头，一大份上好的镓晶，加上所有的硅钢再浇上浓浓的矿渣\n哦这得要不少的水，伽马\n我知道\n另外再来一大桶钛基冷液
block.sfire-mod-heat-generator.name = 地热发电机二型
block.sfire-mod-heat-generator.description = 放在炽热的地形上可以发电，能量产生比例更高。
block.sfire-mod-heat-generator.details = 发电的尽头是烧开水！
block.sfire-mod-radiation-generator.name = 环境辐射发电机
block.sfire-mod-radiation-generator.description = 与地热发电机类似，但其利用辐射环境发电。
block.sfire-mod-radiation-generator.details = 基于压电晶体与波纹钢极致的致密性使得收集环境辐射流打击巨浪合金发电成为可能，在地热发电机的基础上，能源部门针对其外源能量收集进行了改进包括但不限于：辐射流收集，辐热转化，逸散抑制……于是一款在泰伯利亚上十分方便的环境能发电机诞生了\n“我不知道该夸能源部门灵活变通地使用一切可用资源还是该骂战争把泰伯利亚污染成这样而它们竟还有心思利用这份该死的污染”
block.sfire-mod-fermium-reactor.name = 镄反应堆
block.sfire-mod-fermium-reactor.description = 利用镄的强烈放射性产生能量，需要持续冷却液供给，过热或被摧毁会导致剧烈爆炸。
block.sfire-mod-fission-reactor.name = 裂变能量堆
block.sfire-mod-fission-reactor.description = 在内部制造真空区启动链式反应收集大量能量。\n保证其所在地安全！被摧毁会导致巨大的能量在无约束的情况下释放，对周边地区造成严重损伤。
block.sfire-mod-arc-fission-reactor.name = 弧形裂变堆
block.sfire-mod-arc-fission-reactor.description = 在裂位能弧膜之中[stat]安全地[]进行强裂变反应，在短时间内强行撕裂出本应该缓慢释放的放射能，这能够在短时间内带来极高的电能峰值，但并不适合做为大范围长时间供能的主力设施。


#——墙壁——#
block.sfire-mod-steel-wall.name = 硬质钢墙
block.sfire-mod-steel-wall.description = 拦截敌方火力，保护后方建筑。\n一种廉价的快速防御设施，承伤能力虽不如钛墙，但其独特的空心结构能更有效的阻隔轻型射弹带来的影响。
block.sfire-mod-steel-wall-large.name = 大型硬质钢墙
block.sfire-mod-steel-wall-large.description = 拦截敌方火力，保护后方建筑。\n一种廉价的快速防御设施，承伤能力虽不如钛墙，但其独特的空心结构能更有效的阻隔轻型射弹带来的影响。
block.sfire-mod-influx-wall.name = 波能墙
block.sfire-mod-influx-wall.description = 一种更具攻击性的合金墙变体。\n收集敌人的攻击能量，并在之后反射更高的伤害。\n可以阻挡光电武器。
block.sfire-mod-influx-wall-large.name = 大型波能墙
block.sfire-mod-influx-wall-large.description = 一种更具攻击性的合金墙变体。\n收集敌人的攻击能量，并在之后反射更高的伤害。\n可以阻挡光电武器。
block.sfire-mod-explosive-armor.name = 爆炸装甲
block.sfire-mod-explosive-armor.description = 抵挡一定伤害，被摧毁时发生爆炸。对附近一切目标造成小幅伤害并削减范围内子弹的威力。
block.sfire-mod-explosive-armor-large.name = 大型爆炸装甲
block.sfire-mod-explosive-armor-large.description = 抵挡一定伤害，被摧毁时发生较为大型的爆炸，对附近一切目标造成小幅伤害并削减范围内子弹的威力。
block.sfire-mod-discfabric-wall.name = 裂位墙
block.sfire-mod-discfabric-wall.description = 在自身周围打开一道力墙，力墙失效后能反射部分弹药。
block.sfire-mod-fermium-wall.name = 镄墙
block.sfire-mod-fermium-wall.description = 坚硬且致密，耐温差，耐酸碱，耐打击，绝对可靠。
block.sfire-mod-fermium-wall-large.name = 大型镄墙
block.sfire-mod-fermium-wall-large.description = 坚硬且致密，耐温差，耐酸碱，耐打击，绝对可靠。
block.sfire-mod-fermium-auto-door.name = 镄闸门
block.sfire-mod-fermium-auto-door.description = 坚硬且致密，耐温差，耐酸碱，耐打击，绝对可靠。\n在我方单位靠近时自动打开。
block.sfire-mod-complex-armor-wall.name = 复合装甲墙
block.sfire-mod-complex-armor-wall.description = 能够承受大量打击并拦截光电武器，可以安置在水上。
block.sfire-mod-complex-armor-wall-large.name = 大型复合装甲墙
block.sfire-mod-complex-armor-wall-large.description = 能够承受大量打击并拦截光电武器，可以安置在水上。
block.sfire-mod-memory-wall.name = 记忆装甲墙
block.sfire-mod-memory-wall.description = 抵挡大量物理伤害，具有更高的碾压抗性，并在受击时提高一定的护甲。\n在静息状态下自动回溯状态，受击会打断回溯。
block.sfire-mod-memory-wall-large.name = 大型记忆装甲墙
block.sfire-mod-memory-wall-large.description = 抵挡大量物理伤害，具有更高的碾压抗性，并在受击时提高一定的护甲。\n在静息状态下自动回溯状态，受击会打断回溯。
block.sfire-mod-energy-containment-unit.name = 能量核心收容块
block.sfire-mod-armor-containment-unit.name = 模块装甲收容块
block.sfire-mod-tayralloy-containment-unit.name = 泰勒合金收容块
block.sfire-mod-container1.name = 红集装箱
block.sfire-mod-container2.name = 黄集装箱
block.sfire-mod-container3.name = 蓝集装箱
block.sfire-mod-container4.name = 绿集装箱

#——辅助——#
block.sfire-mod-nano-mend-projector.name = 纳米修复投射器
block.sfire-mod-nano-mend-projector.description = 间歇性为大范围内的建筑修复一定比例的耐久度，可以使用纳米核加快修复频率。
block.sfire-mod-nano-regen-projector.name = 纳米再生器
block.sfire-mod-nano-regen-projector.description = 持续地为范围内的建筑提供缓慢修复，可以使用纳米核提升修复速度。
block.sfire-mod-nano-unit-regener.name = 纳米单位维护站
block.sfire-mod-nano-unit-regener.description = 持续性为一定范围内的单位维修。
block.sfire-mod-nano-unit-regener.details = 随着第一军团行动的展开，大量由于广寒无法及时提供支援而损伤的单位逐渐堆积，有效战斗力无法得到及时补充，纳米单位维护站应运而生，这有效解决了受损单位的大批量维修问题，同时其较高的成本也导致在部分资源紧缺地区难以部署，更多情况下依然是使用传统维修节点对单位进行修复
block.sfire-mod-iron-curtain.name = 铁幕力场引擎
block.sfire-mod-iron-curtain.description = 不稳定的实验性防御建筑。\n消耗大量电力生成一个小范围吉瓦级力场。\n使用泰勒合金以提升引擎功率上限。
block.sfire-mod-iron-curtain.details = 这种小型化的护盾技术在确保面积承伤能力的同时能够提高局部的恢复速度，通常用于保护部分高价值目标。但缺点同样显著：持续高负荷运作导致的引擎过热往往会需要更长时间来恢复运行，在力场护盾重新启动之前的这段空档期无论对引擎本体还是其所保护的高价值目标都是相当危险的
block.sfire-mod-iron-dome.name = 铁穹力场引擎
block.sfire-mod-iron-dome.description = 大型穹顶发生器。\n消耗大量能量生成一个大范围兆瓦级力场。保护其中的单位与建筑不受到实弹伤害。
block.sfire-mod-iron-dome.details = 相较于铁幕的针对重点保护，铁穹引擎的研发方向是针对阵地的大范围保护——这通常会消耗大量能量与资源——同时，更大的生效范围意味着在相同时间内引擎会承受更多甚至饱和级的损伤，但大型引擎有充足的换热面积，在拥有充足冷却供应时更不容易过热。\n在面对大规模攻防战时，若铁穹依然在运行，应在其接敌过热之前为其提供足够量的冷却。
block.sfire-mod-front-line-core.name = 前哨核心
block.sfire-mod-front-line-core.description = 可拆除的前锋核心，只提供最低限度的核心功能。
block.sfire-mod-front-line-core.details = 大型核心由于其笨重性并不适合也不方便在战况紧张的前线布设，而小型核心在战斗中却又没有足够的生存性能，且防线距离核心区太远便会承担极大的资源压力，一款轻便而坚实的小型扩展核心因此而生——它保留了物资转运、区域监测、建造机部署等核心功能，模块化设计允许其在时机合适时扩建为一座大型基地。
block.sfire-mod-industry-core.name = 勤务核心
block.sfire-mod-industry-core.description = 重型存储核心，容量最大。
block.sfire-mod-industry-core.details = 正面战场逐步扩大，老旧的终代核心已无法再适应日益险恶的前线环境\n“它甚至无法在破片纷飞的战场上存活，何谈予以前线支援”\n新型核心与新一代核心机的研发同步提上日程。\n第四代重型战术核心由此而生，它能够抵御更多的攻击，充足的存储空间与新一代核心机能够为附近任何防线提供足量的勤务支持。
block.sfire-mod-final-command-core.name = 最高指挥中心
block.sfire-mod-final-command-core.description = 战区核心，装甲厚重，提供更多单位容量。

#——单位工厂——#
block.sfire-mod-special-factory.name = 特种工厂
block.sfire-mod-special-factory.description = 研究、生产先进特殊战斗单位。\n可以承接倍乘级作战单位订单。
block.sfire-mod-special-factory.details = 由倍乘级单位重构工厂改造而来，设施较为完备，能够以较快的速度构建第三级单位。同时承担各种改装测试任务与新兴功能性单位制造。

block.sfire-mod-pentative-reconstructor.name = 泰特级单位重构工厂
block.sfire-mod-pentative-reconstructor.description = 在原有基础构造之上升级护甲，能源，武器等方面。
block.sfire-mod-pentative-reconstructor.details = ■■部在■■■战区遭受严重打击，我们了解到现有武器装备已经不足以支撑日益增长的各类任务。\n敌人的防线与军工厂正在逐渐规模化，他们妄图利用地缘优势瓦解我们的进攻。\n这是必要的一步：升级装甲、优化能源核心与分配系统、更有针对性的特化武备······泰特级作战单位将成为立竿见影的破局之法，但并非是唯一的办法

block.sfire-mod-terr-assembler.name = 阔野管理中心
block.sfire-mod-terr-assembler.description = 组装阔野。
block.sfire-mod-elec-assembler.name = 电鳄组装器
block.sfire-mod-elec-assembler.description = 组装电鳄。
block.sfire-mod-payload-construstor.name = 收容块构造器
block.sfire-mod-payload-construstor.description = 构造多种收容块，用于作战单位的组装。

block.sfire-mod-war-farctory-assembler.name = 战争工厂
block.sfire-mod-war-farctory-assembler.describtion = 建造巨型作战单位。

#——单位——#
unit.sfire-mod-flareX.name = 麦芒
unit.sfire-mod-flareX.description = 发射追踪导弹，对地面目标投下燃烧弹。
unit.sfire-mod-flareX.details = [#a3ba73]溢裂数据库已解码：\n[]中型多用途战斗机。这奇异的外形之下隐藏着如此恐怖的机动性能，这可能是我们的雷达无法探测到它的原因之一？\n[red]一切尚不明确，我们需要更多数据······
unit.sfire-mod-electrodile.name = 电鳄
unit.sfire-mod-electrodile.description = 搭载三联装重型电浆炮，近地悬浮能跨越部分地形。
unit.sfire-mod-electrodile.details = [#a3ba73]溢裂数据库已解码：\n[]实验型重型悬浮载具。从其内置系统与能量分配推测由雷鸣系列发展而来。后续的改进型号中增设短程推进系统，用于翻越中小型复杂地形。\n从中央数据库获取其蓝图后，逆向工程的瓶颈转移到了能源与护甲系统上……
unit.sfire-mod-thunderclap.name = 霹雳
unit.sfire-mod-thunderclap.description = 搭载分装式对地脉冲炮，对空中目标发射瘫痪性脉冲导弹。
unit.sfire-mod-thunderclap.details = [#a3ba73]溢裂数据库已解码：\n[]重型火力投送空艇。尽管其内部设备已经大幅改动，但依然可以看出其师承雷鸣一脉。\n[black]看起来像是技术成熟的种类
unit.sfire-mod-knocker.name = 敲门砖
unit.sfire-mod-knocker.description = 步行爆破机甲，对目标发动毁灭性打击。
unit.sfire-mod-knocker.details = [#a3ba73]溢裂数据库已解码：\n[]搭载高爆串联战斗部，解除保险后发射。\n直接损毁小范围建筑并对杀伤范围内的单位造成损伤，瘫痪大面积的修复装置。
unit.sfire-mod-knocker-missile.name = 敲门砖

unit.sfire-mod-partiality-A.name = 偏袒-甲
unit.sfire-mod-partiality-A.description = 精英机动反装甲部队。跨越大多数地形发动突袭。
unit.sfire-mod-partiality-B.name = 偏袒-乙
unit.sfire-mod-partiality-B.description = 精英机动炮击部队。跨越大多数地形发动炮击。\n对建筑造成更多损坏。
unit.sfire-mod-partiality-C.name = 偏袒-丙
unit.sfire-mod-partiality-C.description = 精英机动导弹部队。跨越大多数地形发射质子导弹。\n对空军造成更高伤害。
unit.sfire-mod-partiality-D.name = 偏袒-丁
unit.sfire-mod-partiality-D.description = 精英机动勤务部队。跨越大多数地形修复附近友方单位。\n携带[stat]主动式[]三叠内爆弹，[red]切莫使其接近防线！！！
unit.sfire-mod-partiality-D.details = 似乎使用某种特殊材质的机体外壳，会吸收一切频段的能量并在某种条件下增强内部能量源



unit.sfire-mod-blade.name = 利刃
unit.sfire-mod-blade.description = 标准化轻型护航舰只，搭载激光照射炮与巡航导弹系统。\n能够拦截临近的实体弹药并修复附近的单位。
unit.sfire-mod-blade-missile.name = 利刃导弹
unit.sfire-mod-titan.name = 泰坦
unit.sfire-mod-titan.description = 标准化重型地面战斗机甲，搭载中程大口径霰弹炮与加农炮。\n能够为附近的单位提供护盾与超频。
unit.sfire-mod-vast.name = 沧海
unit.sfire-mod-vast.description = 标准化重型水面战斗舰艇，搭载复合垂直发射系统和短程激光。\n能够拦截临近的实体弹药。\n会针对难以消灭的目标发动饱和打击。

unit.sfire-mod-伯劳.name = 伯劳
unit.sfire-mod-伯劳.description = 信息缺失！
unit.sfire-mod-亚龙.name = 亚龙
unit.sfire-mod-亚龙.description = 信息缺失！

#我方可用
unit.sfire-mod-ordinance.name = 立宪
unit.sfire-mod-ordinance.description = 攻击附近所有敌人。发射巨型穿甲爆破弹与闪电链，穿透敌军和建筑。\n正面强攻与空降作战的核心力量之一。
unit.sfire-mod-ordinance.details = 剩 者 为 王
unit.sfire-mod-libra.name = 地星
unit.sfire-mod-libra.description = 折跃能量炸弹砸向敌人造成严重破坏，对护盾杀伤力显著。\n发射大型脉冲激光束并修复友方建筑。\n为临近的友方单位提供强化。\n能跨越大多数地形。
unit.sfire-mod-libra.details =
unit.sfire-mod-agelenid.name = 盘龙
unit.sfire-mod-agelenid.description = 发射追踪火箭与大量激光，并在此过程中修复自己。\n能跨越大多数地形。
unit.sfire-mod-agelenid.details =
unit.sfire-mod-hepta.name = 广寒
unit.sfire-mod-hepta.description = 修理友方单位并提供护盾，使用干扰能量场电击附近敌人并发射切割光束。可以携带大型单位或方块。
unit.sfire-mod-hepta.details =
unit.sfire-mod-sundown.name = 余辉
unit.sfire-mod-sundown.description = 攻击附近所有敌人。发射密集的带电分裂弹，投送远程巡飞弹。
unit.sfire-mod-sundown.details =
unit.sfire-mod-sundown-missile.name = 余辉导弹
unit.sfire-mod-dorudon.name = 滕王
unit.sfire-mod-dorudon.description = 攻击附近所有敌人。发射密集的高爆导弹与破片导弹。搭载对护盾有强大破坏能力的裂位轨道炮。
unit.sfire-mod-dorudon.details =
unit.sfire-mod-cerberilla.name = 罗汉
unit.sfire-mod-cerberilla.description = 攻击附近所有敌人。发射大量脉冲弹与震爆弹，对敌方供给链造成毁灭性打击。\n保护并修复临近的友方单位。
unit.sfire-mod-cerberilla.details =



unit.sfire-mod-vanguard.name = 冲锋
unit.sfire-mod-vanguard.description = 向附近敌人发射大口径子弹。
unit.sfire-mod-vanguard.details = 造价低廉，机动性优良，常被用于火力侦查。\n为了保留其高机动性，我们不得不舍弃了大口径反建筑弹药，但在面对敌方单位时依然具有一定的生存能力。
unit.sfire-mod-striker.name = 突袭
unit.sfire-mod-striker.description = 发射高爆火箭，重装速度较慢。\n密封舱室，可以跨越水域。
unit.sfire-mod-striker.details = 兼备机动与火力，能够快速从多方位突入战场支援。\n——“唯一的缺点是不能跨越山脉”\n——“那为什么不使用空军呢？”
unit.sfire-mod-skyfire.name = 轰炸
unit.sfire-mod-skyfire.description = 向远程地面目标发射12枚高爆火箭弹，对建筑破拆效果极佳。
unit.sfire-mod-skyfire.details = 一款经典的远程火力投送方案，尽管其设计来自远古年代，但结构简单投送能力强悍使得它依然活跃在战场一线。\n发射前需要架起，注意提防敌人的远程打击与空中力量！\n“浪漫而致命”
unit.sfire-mod-flanker.name = 反击
unit.sfire-mod-flanker.description = 发射反装甲冲击弹。\n能够碾压建筑。
unit.sfire-mod-flanker.details = 过去用于搭载光棱攻城平台的底盘因系统兼容性极差且能耗较高导致机体臃肿，如今被用于搭载反装甲武器。这门中口径高倍身管炮能有效击碎敌人与护盾，但这种弹药并不适合用于打击建筑装甲，面对敌方火炮阵地时请注意规避。
unit.sfire-mod-executioner.name = 斩首
unit.sfire-mod-executioner.description = 发射大口径氚芯聚爆弹引起二次爆炸。\n能够碾压建筑。\n优先攻击核心。
unit.sfire-mod-executioner.details = 优秀的机动底盘与足够大的车身容积令其能适配多种多样的武器配置，这台坦克身上曾经装载过许多武器：激光照射炮、电磁炮、聚变加农炮，但仅使用激光照射炮的版本由于其不堪入目的对单位命中与杀伤性能以及巨大能耗所致的低下机动性而十分容易被空军部队所击毁。经战损数据对比，所有搭载激光照射炮的斩首被全部改为聚变加农炮，附加一对同轴激光发射器，并将此版本作为所有同系坦克的默认出厂设置。
unit.sfire-mod-enforcer.name = 平定
unit.sfire-mod-enforcer.description = 交替性使用大口径穿甲震撼弹与高爆导弹压制目标。\n能够碾压建筑。
unit.sfire-mod-enforcer.details =

unit.sfire-mod-convection.name = 多云
unit.sfire-mod-convection.description = 发射磁扰波束。
unit.sfire-mod-convection.details =
unit.sfire-mod-sleet.name = 霜雪
unit.sfire-mod-sleet.description = 发射冷冻光束，拖延敌人行进并造成些许伤害。
unit.sfire-mod-sleet.details =
unit.sfire-mod-cumulus.name = 燃空
unit.sfire-mod-cumulus.description = 发射高能光束与燃烧导弹。
unit.sfire-mod-cumulus.details =
unit.sfire-mod-circulation.name = 飓风
unit.sfire-mod-circulation.description = 发射密集的能量弹与震爆弹。
unit.sfire-mod-circulation.details = ——战斗性能评估报告——\n“由两台飓风组成队伍能够有效截杀大部分移动目标或将建筑集群夷为平地，但却不能有效应对高护甲目标，在遇到拥有对空火力或者重型装甲目标时应当尽快撤离，避免更多不必要的损失。”
unit.sfire-mod-cirrus.name = 雷暴
unit.sfire-mod-cirrus.description = 发射磁爆能量弹与雷雨生成器。拥有小型护盾发生器。
unit.sfire-mod-cirrus.details = 大量能量在一定区域内快速爆发对于力场发生器的损伤是毁灭性的，但对接地的重型建筑效果不好，在雨天能发挥对部队的最高杀伤性能
unit.sfire-mod-stratosphere.name = 地动
unit.sfire-mod-stratosphere.description = 投下电默弹与攻顶燃烧弹。配备防空冷冻光束。\n可以携带单位进行空降作战。

unit.sfire-mod-alnitak.name = 参宿
unit.sfire-mod-alnitak.description = 发射小口径炮弹和中程制导鱼雷。
unit.sfire-mod-alnitak.details = 机动性能优秀，常作为海岸巡逻队，能够高效清理落单的敌方船只或其他小型目标
unit.sfire-mod-polaris.name = 北斗
unit.sfire-mod-polaris.description = 发射冲击束，使用汲取光束修复自身。\n配备巡航系统，拥有更大的视野范围。
unit.sfire-mod-polaris.details =
unit.sfire-mod-antares.name = 罗星
unit.sfire-mod-antares.description = 搭载通用垂直发射单元，发射小型质子炮弹与弹道导弹。
unit.sfire-mod-antares.details = 发现敌人并不能完全确保场面控制权在你的手上，罗星所搭载的强劲的能源系统与以及优秀的火控雷达使得它能快速响应到任何一个位置去，无论其任务是防空还是反舰
unit.sfire-mod-merak.name = 天罡
unit.sfire-mod-merak.description = 重型防空舰艇。\n发射密集的防空导弹和质子炮。
unit.sfire-mod-merak.details = 其强大的能量核心与火控分配使得它成为了第一代质子炮“漫游”的最佳实验平台，即使是重型空中目标也无法抵挡质子炮的撞击与防空导弹所致海量损伤。
unit.sfire-mod-regulus.name = 玄冥
unit.sfire-mod-regulus.description = 发射大型质子鱼雷与质子炮。携带三对全自动导弹发射器。
unit.sfire-mod-regulus.details = 某些型号曾被用于搭载战术弹道导弹，但受制于平台潜力以及高昂成本而无法大规模使用。\n随着某重型弹道导弹的研发列装而逐渐退出现役
unit.sfire-mod-alioth.name = 重堂
unit.sfire-mod-alioth.description = 发射氘芯弹与高聚氚芯脉冲弹，对敌电子设备造成严重伤害。
unit.sfire-mod-alioth.details = 以“光阴”为首的一批尖端科技——第三代质子炮的杀伤性能十分显著，但它因为能耗过高而无法批量列装与移动平台上。\n而裂位引擎小型化使得第四代试验性质子聚变武器能够实现并搭载在移动平台上，甚至有多余能量分配给已经小型化的第二代质子炮系统。\n作为新一代远程重火力支援舰，其机动性能堪忧，尽量不要让它暴露在敌人的直接攻击下。

unit.sfire-mod-tadpole.name = 呲蜉
unit.sfire-mod-tadpole.description = 用于小型载荷与物资的搬运。
unit.sfire-mod-tadpole.details = 第一代小型反重载具，显然引擎强度略高于设计指标，这导致它并未能按计划以近地悬浮行驶反而高高飞起。\n充足的改装预留空间可以被用于后续改装搭载各类设备，但鉴于这一代设计已定型，遂用于搬运物品、作战单位甚至轻型建筑
unit.sfire-mod-dendrobate.name = 箭毒
unit.sfire-mod-dendrobate.description = 向附近的目标喷洒强酸，腐蚀目标。
unit.sfire-mod-dendrobate.details = 这是首次将酸液直接搭载在作战单位上使用，它对建筑的杀伤性能简直可以忽略不计，但对其他作战单位的护甲与各种铰接部位的杀伤性能异常优良，加之两栖移动的机动性使得它们迅速成为炙手可热的辅助作战配置。\n鉴于其对建筑伤害微乎其微，在紧急情况下可以利用这些液体去扑灭火焰，尽管后勤部门并不推荐这么做
unit.sfire-mod-bombina.name = 铃蟾
unit.sfire-mod-bombina.description = 发射粘性纳米弹头导弹，对依附的目标造成持续伤害。
unit.sfire-mod-bombina.details = 新一批纳米武器搭载了智能弹头，它们只会专注于分解敌人或者修复己方建筑其中的一种，由磁性引信统一调控。
unit.sfire-mod-bullfrog.name = 牛蛙
unit.sfire-mod-bullfrog.description = 搭载两门自动霰射防空炮，同时使用一门酸蚀机枪攻击附近的目标。
unit.sfire-mod-bullfrog.details = 作为现役专职制空舰的天罡其作战性能固然强大，但只能在海上提供空中防护，这使得部队登陆作战不得不被敌方空中重火力所威胁。作战部队急需一种高机动性的两栖支援单位，牛蛙载具强劲的悬浮引擎使得它能够在携带重武器的情况下快速机动伴随主力作战。
unit.sfire-mod-salamander.name = 蝾螈
unit.sfire-mod-salamander.description = 发射磁扰波束与穿甲内爆弹，快速破除护盾，同时对重甲、大体积目标有更高杀伤效率。
unit.sfire-mod-salamander.details =
unit.sfire-mod-gharial.name = 巨鳄
unit.sfire-mod-gharial.description = 短暂充能后发射强大的离子炮，需要时间锁定目标，免疫绝大多数物理异常状态效果。
unit.sfire-mod-gharial.details = 代号“多智龙”的两栖作战系统与“乳齿象”的移动式热浪项目各自取得成功，其研发成果后用于建造此项目。\n其搭载的轻型移动式热浪轨道炮威力得以最大程度保留，作为重型攻城载具，武器的输出功率进行了调整使得它能快速熔化敌军建筑或者装甲。

unit.sfire-mod-space-missile.name = 反舰导弹 I 型
unit.sfire-mod-space-missile.name = 反舰导弹 II 型

unit.sfire-mod-arma.name = 兵刃
unit.sfire-mod-arma.description = 中坚战斗舰船，这将是你的长期主力战舰。\n发射反舰导弹或高斯炮来攻击附近的敌人。\n可以拦截敌方导弹。
unit.sfire-mod-bifurca.name = 双股
unit.sfire-mod-bifurca.description = 第二代通用中坚作战部队，向附近的目标发射难以拦截的高速鱼雷或高斯炮。
unit.sfire-mod-cinnabar.name = 红缨
unit.sfire-mod-cinnabar.description = 大型战舰，承担大部分作战中的攻防行动。\n使用热粒子炮进行作战，在短程内使用小型武器拦截敌方火力。

unit.sfire-mod-piercer.name = 穿行
unit.sfire-mod-piercer.description = 高速侦察舰船，牺牲部分防御力量换取更高的速度。\n发射反舰导弹或高斯炮来攻击附近的敌人。\n可以拦截敌方导弹，[red]但效率较低[]。
unit.sfire-mod-permeater.name = 渗透
unit.sfire-mod-permeater.description = 第二代高速侦查部队，向附近的目标发射难以拦截的高速鱼雷或高斯炮。
unit.sfire-mod-phantom.name = 幻影
unit.sfire-mod-phantom.description =

unit.sfire-mod-vagris.name = 定远
unit.sfire-mod-vagris.description = 重型火力支援舰船，搭载大量弹药并携带单体护盾。\n发射反舰导弹或高斯炮来攻击附近的敌人。\n可以拦截敌方导弹。
unit.sfire-mod-concord.name = 致和
unit.sfire-mod-concord.description = 第二代重型火力支援部队，携带力场护盾。\n向附近的目标发射大装药量导弹，使用短程激光攻击目标。
unit.sfire-mod-ewer.name = 方尊
unit.sfire-mod-ewer.description =

unit.sfire-mod-shatter.name = 摧坚
unit.sfire-mod-shatter.description = 火力突袭舰船，搭载更多弹药，拥有更高的火力密度。\n发射反舰导弹或高斯炮来攻击附近的敌人，[red]但发射角度固定[]。\n可以拦截敌方导弹。
unit.sfire-mod-siege.name = 破城
unit.sfire-mod-siege.description =
unit.sfire-mod-remnant.name = 残垣
unit.sfire-mod-remnant.description =

unit.sfire-mod-geological-hammer.name = 地质锤
unit.sfire-mod-geological-hammer.description = 发射重型导弹，这种导弹易被拦截。自保能力较差，需要保护。
unit.sfire-mod-geological-hammer-missile.name = 地质锤导弹


unit.sfire-mod-assembler-drone.name = 组装无人机
unit.sfire-mod-assembler-drone-large.name = 大型组装无人机
unit.sfire-mod-armed-drone.name = 默途
unit.sfire-mod-armed-drone.description = 搭载4门并列脉冲枪，自主侦察推进并攻击附近所有敌人。\n拥有一个护盾发生器。
unit.sfire-mod-armed-drone.details = 中型查打一体作战单位。作为廉价的突进部队来说，它足够优秀；作为战斗单位来说，它太过脆弱。妥善利用它的侦察设备为战局掌握更多主动性。

unit.sfire-mod-farmer.name = 工农
unit.sfire-mod-farmer.description = 自动重建损坏的建筑并攻击靠近的敌人。发射瘫痪激光与纳米弹。修复附近的友方单位。
unit.sfire-mod-farmer.details = [lime]工农武装割据！[]\n为适应泰伯利亚战场复杂环境而打造的一代全能勤务舰只，搭载“红星”核心系统，能够自动适应各种任务的行为操控与能源分配。
unit.sfire-mod-carrier.name = 群众
unit.sfire-mod-carrier.description = 提供更强大的战场运载能力。\n搭载短程强酸喷枪。
unit.sfire-mod-carrier.details = 由原型工农改造而来的一型仅执行载荷运载任务的勤务舰只，搭载“红星-乙”核心操控系统。\n[red]抛弃武器系统与火控雷达[]使飞控系统能精准分配动力能源。


unit.sfire-mod-flamer.name = 锻火
unit.sfire-mod-flamer.description = 装载爆燃切割枪与矿渣榴弹抛射器。\n攻击会点燃目标并对建筑造成较大损害。
unit.sfire-mod-thunder.name = 雷鸣
unit.sfire-mod-thunder.description = 发射脉冲弹与闪电发生器。\n护甲厚重但本体略为脆弱，注意规避敌重型防空火力。
unit.sfire-mod-banisher.name = 竭泽
unit.sfire-mod-banisher.description = 发射小型激光和定向冲击弹。\n为附近的单位提供保护。\n能够跨越水域。
unit.sfire-mod-banisher.details = “长弓”实验平台的使命自海军武备完成整改而结束，凭借其优秀的基础设计所积攒下的海量数据与可行性方案是一笔无尽的财富，而这便是它所能为我们带来的最后一份礼物——\n继承了其能源体系发展而来，在数个特种机械中拥有最远主炮杀伤距离与最强激光拦截性能的泛用性两栖炮艇
unit.sfire-mod-hammer.name = 攻城锤
unit.sfire-mod-hammer.description = 向地面目标发射大口径榴弹炮。\n能够跨越大部分固态地形。
unit.sfire-mod-hammer.details =

unit.sfire-mod-terrascape.name = 阔野
unit.sfire-mod-terrascape.description = 投送超载引力发生器与光子导弹。间歇性发射冲击束，配备空域静电场。
unit.sfire-mod-terrascape.details = 对敌战线越来越广阔，每次行动所遭遇的敌对势力越来越强大，阔野的出现几乎解决了所有难题。作为一支全能战舰，无论是攻城还是破军，他无所不能。\n凶悍的火力与极强的建造、保护能力使得他完全足以独当一面。\n同时其过高的耗材与巨大的维护消耗成为了后勤的一大考验，目前仅有第五军团拥有批量派遣阔野的能力。
unit.sfire-mod-stardust.name = 碎辰
unit.sfire-mod-stardust.description = 只攻击指定目标，发射超视距弹道能量弹，[gold]有概率强行突破力场直接攻入内部。[gray]装甲厚重但几乎没有近战自保能力。
unit.sfire-mod-tau.name = 陶
unit.sfire-mod-tau.description = 保护勤务核心。\n建造能力最强，可以开采四级矿石。\n发射短程纳米蜂巢导弹攻击敌人或修复建筑。
unit.sfire-mod-tau.details = 正面战场逐步扩大，老旧的伽马已无法再适应日益险恶的前线环境\n“它甚至无法在破片纷飞的战场上存活，何谈予以前线支援”\n新型核心与新一代核心机的研发同步提上日程。\n以工农为原型，搭载“红星-甲”核心操控系统，重置了武器采矿建筑等方面能量分配的改进型“民兵”被选中成为新一代核心机并正式列装，代号“陶”。
unit.sfire-mod-omega.name = 欧米茄
unit.sfire-mod-omega.description = 保护最高指挥中心。\n拥有快速建造能力。\n发射穿甲燃烧弹与导弹。
unit.sfire-mod-omega.details = 我们先进的欧米茄战斗核心机早已超越了老式的Glaive战艇

unit.sfire-mod-UTV.name = 两栖装甲运载车
unit.sfire-mod-UTV.description = 运载大量物品。\n配备质子冲击枪可以快速使护盾破损，全密封重装甲。\n可以跨越非固体地面。
unit.sfire-mod-UTV-Artillery.name = 质子榴炮运载车
unit.sfire-mod-UTV-Artillery.description = 使用装甲运载车作为底盘，并放弃一切载货容量转为一门质子榴弹炮以及纳米修复系统。\n无法跨越非固体地面。\n[stat]强大远程地面支援能力。
unit.sfire-mod-UTV-Command.name = 战地指挥车
unit.sfire-mod-UTV-Command.description = 使用装甲运载车作为底盘，并放弃一切载货容量转为搭载小型车载雷达，其拥有更广阔的视野。负责作战指挥或指引炮火打击。\n可以跨越非固体地面。\n[red]被摧毁会导致我们丢失该地区的战场控制，务必保护！
unit.sfire-mod-UTV-Defense.name = 防御扩展运载车
unit.sfire-mod-UTV-Defense.description = 使用装甲运载车作为底盘，并放弃一切载货容量转为一座点防御系统以及小型力场发生器。\n可以跨越非固体地面。\n[stat]提供中程实弹防御与近程护盾。
unit.sfire-mod-UTV-Missile.name = 防空导弹运载车
unit.sfire-mod-UTV-Missile.description = 使用装甲运载车作为底盘，并放弃一切载货容量转为一台四联装导弹发射器以及纳米修复系统。\n可以跨越非固体地面。\n[stat]强大中程防空能力。

