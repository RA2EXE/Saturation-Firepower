block.sfire-mod-nanofluid-activator.details = 取决于纳米核的制程和良品率，这可能会有所损耗
block.sfire-mod-nanofluid-mixer.name = 纳米转化厂
block.sfire-mod-nanofluid-mixer.description = 当冷冻液产能过剩时，将足量的冷冻液迅速转化为一定数量的纳米流体。\n设计操作弹性极大，为避免不必要的浪费，请自行计算所需产能比例。
block.sfire-mod-blastreagent-mixer.name = 爆破剂配置器
