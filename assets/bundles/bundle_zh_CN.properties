block.sfire-mod-kuodao.name = 阔刀
block.sfire-mod-kuodao.description = 短程破片炮塔，有效击退单位，对建筑效果甚微。
block.sfire-mod-mini.name = 米尼
block.sfire-mod-mini.description = 液冷式双联装小口径火炮，液冷效率相比常规炮台更高。
block.sfire-mod-mini.details = 火力持久，久到离谱
block.sfire-mod-woliu.name = 涡流
block.sfire-mod-woliu.description = 喷射大型液体球，更容易在地面形成液体区域。\n与常规液体炮台拥有相同功能。\n[red]使用[green]纳米流体[]作为弹药时会发射具有杀伤性的[green]活化纳米流体！
block.sfire-mod-woliu.details = 一种更加武器化的液体炮台方案，但不推荐使用纳米流体作为火场管控……
block.sfire-mod-tieliu.name = 铁流
block.sfire-mod-tieliu.description = 使用矿渣作为弹药，喷射短程破甲金属射流。
block.sfire-mod-tieliu.details = 盾弹对抗最新力作——当作为金属射流载体的破甲弹因复合装甲、力场保护、反应装甲等因素而无法对目标造成有效伤害时——我们选择让敌人送上门来而不是使用发射药将战斗部送到敌人那去
block.sfire-mod-dianji.name = 电极
block.sfire-mod-dianji.description = 使用离子聚焦发生器对敌人持续轰击。
block.sfire-mod-dianji.details = 先进粒子物理学武器初代研究成果
block.sfire-mod-changqiang.name = 长枪
block.sfire-mod-changqiang.description = 向目标发射大量小型导弹或中型冲击火箭，需要时间预热。\n优先打击最弱的目标以确保有效杀灭。
block.sfire-mod-changqiang.details = 一个中程通用性火箭武器的过渡型号，装载弱主动制导设备。\n追求多用途使其各项属性均不足以达到某些针对性标准，有所得必有所失······
block.sfire-mod-longjuan.name = 龙卷
block.sfire-mod-longjuan.description = 发射集束螺旋弹掀翻前方区域。[yellow]对于弹药供给速度要求较高！
block.sfire-mod-longjuan.details = [purple]龙卷风摧毁停车场！
block.sfire-mod-manyou.name = 漫游
block.sfire-mod-manyou.description = 实验型质子撞击炮，发射由纯能量包裹的氢离子引发粒子崩溃并熔毁敌人与装甲。
block.sfire-mod-manyou.details = 让 质 子 飞
block.sfire-mod-chuanyun.name = 穿云
block.sfire-mod-chuanyun.description = 发射多种类马赫级炮弹。
block.sfire-mod-chuanyun.details = 经典款中倍率身管式火炮，在面对不同作战目标时可以通过临时换装不同弹头以达成目的，但这需要固定种类的弹药供给。\n若弹药链混入杂物可能导致混乱而不得不暂停射击计划。
block.sfire-mod-cijian.name = 刺剑
block.sfire-mod-cijian.description = 扫射前方大片面积，击穿敌人与护盾。
block.sfire-mod-cijian.details = 劈劈啪啪，乒乒乓乓，一顿混乱，惨绝人寰
