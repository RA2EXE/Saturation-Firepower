sector.sfire-mod-.name = []
sector.sfire-mod-.description = []

sector.sfire-mod-frozenFront.name = 冻点前哨
sector.sfire-mod-frozenFront.description = 经过长年累月的观测，我们终于抓到了此处轨道防御火力维护的空档，这里将成为反攻泰伯利亚的第一站，务必在窗口期结束前以最快的速度清空核心区域并防止敌人呼叫增援！

sector.sfire-mod-centerCore.name = [stat]中央本部
sector.sfire-mod-centerCore.description = 在你处理轨道防御工事之时，数支小队在根据过去的地图同步搜索附近区域。\n其中一支找到并发布了集合坐标，几支小队正在重启以前在这座星球上建立的一座大型基地及其部分防御设施，但彻底令其恢复运作仍有一些工作要做，尤其是启动灯塔信标阵列，否则增援部队只能通过先前打开的轨道防御缺口派遣，虽然无异于杯水车薪但总比没有好。此次行动万分必要且直接关系到能否夺回泰伯利亚，敌人不可能注意不到如此巨大规模的要塞活动。\n尽快行动，附近的侦查队报告有许多敌人正在靠近，组织阵地防守信标直到其他军团落地。

sector.sfire-crackHills.name = 横断丘陵
sector.sfire-crackHills.description = 敌人正在源源不断地向此处发送进攻部队，第一军团将战线控制在了一处易守难攻的丘陵地区，利用地形优势建立阵地抵挡敌人的攻击。\n数批远程炮火部队正在路上，当他们抵达目标位置后便可以彻底锁死该区域。
#解锁方天，后续丁达尔
sector.sfire-sandValley.name = 沙暴谷
sector.sfire-sandValley.description = 这片区域因长期的风沙侵蚀而破碎不堪，飞行器较难在此处长时间行进，地面部队推进相对来说较为稳定。一支侦查勘测小队被派遣前出行动，但在途中因风沙所致设备故障而断联。\n最后一次信号定位在此处，依据行动守则车队应该已停止前进并就近寻找安全地带建设临时哨位等待重连，找到他们。
#解锁T6厂，海军两个
sector.sfire-craterBay.name = 弹坑海湾
sector.sfire-craterBay.description = 十分规整的圆形地坑，横跨数百单位距离、深度未探测、成因未知、地表留有部分放射性。有说是一场未知当量的相位能武器实验所致、也有说是曾经大规模采矿所留……但这些都已不再重要。\n海水倒灌填满了这里，经过实地工程勘察，地质条件及资源储量足以建立并运营一座较大规模的海军基地，第二军团已在建设途中，前往协助他们。

