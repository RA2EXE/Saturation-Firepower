block.sfire-mod-gaosi.name = 高斯
block.sfire-mod-gaosi.description = 发射电浆炮弹延缓目标的速度并造成伤害。
block.sfire-mod-gaosi.details = 经典款式电浆加农炮，这种原始但有效的武器在负责未知勘探的部队中被广泛列装，但随着各种新型离子武器与能量护甲的兴起而逐渐没落。
block.sfire-mod-liebao.name = 裂爆
block.sfire-mod-liebao.description = 中型震爆武器，聚集能量团投向敌人造成短暂干扰。
block.sfire-mod-cuodao.name = 锉刀
block.sfire-mod-cuodao.description = 中口径对空霰弹炮。与差扰光束协同可有效牵制空军部队。
block.sfire-mod-longxi.name = 龙息
block.sfire-mod-longxi.description = 短程喷火器，焚烧一切靠近的目标。
block.sfire-mod-longxi.details = 瑞克五代电磁打火系统！
block.sfire-mod-mengma.name = 猛犸
block.sfire-mod-mengma.description = 向附近的地面目标实施快速精确的炮击。
